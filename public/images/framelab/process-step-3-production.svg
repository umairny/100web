<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141519"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="rgba(229, 223, 211, 0.28)"/>
      <stop offset="70%" stop-color="rgba(229, 223, 211, 0.05)"/>
      <stop offset="100%" stop-color="rgba(229, 223, 211, 0)"/>
    </linearGradient>
    <radialGradient id="softboxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e5dfd3"/>
      <stop offset="100%" stop-color="#2a2824"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGrad3)"/>

  <!-- Studio Light Octabox Cone & Beams -->
  <polygon points="60,30 380,180 340,300 30,120" fill="url(#lightBeam)"/>

  <!-- Studio Octabox Softbox (Top Left) -->
  <g transform="translate(45, 45) rotate(24)">
    <polygon points="0,-35 25,-25 35,0 25,25 0,35 -25,25 -35,0 -25,-25" fill="url(#softboxGlow)" stroke="#c5b8a5" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff" filter="drop-shadow(0 0 10px rgba(255,255,255,0.8))"/>
    <!-- Stand bracket -->
    <path d="M-30 0 L-60 -10" stroke="#4a4f5c" stroke-width="4"/>
  </g>

  <!-- Hasselblad / Phase One Medium Format Camera Setup (Center-Right) -->
  <g transform="translate(240, 110)">
    <!-- Tripod Legs -->
    <line x1="45" y1="65" x2="10" y2="175" stroke="#333842" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="45" y1="65" x2="45" y2="175" stroke="#404654" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="65" x2="80" y2="175" stroke="#333842" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Tripod Ball Head Mount -->
    <rect x="36" y="55" width="18" height="14" rx="2" fill="#1f2229"/>
    
    <!-- Camera Body (Boxy Medium Format) -->
    <rect x="18" y="15" width="56" height="42" rx="4" fill="#181a20" stroke="rgba(229,223,211,0.4)" stroke-width="1.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.6))"/>
    
    <!-- Digital Back / Battery Pack -->
    <rect x="8" y="20" width="12" height="32" rx="2" fill="#0d0e12" stroke="rgba(255,255,255,0.2)"/>
    <rect x="11" y="25" width="6" height="10" fill="#e5dfd3" opacity="0.8"/>
    
    <!-- Prime Lens (Leftwards towards subject) -->
    <rect x="-8" y="23" width="28" height="26" rx="2" fill="#0e0f14" stroke="#444a57" stroke-width="1.5"/>
    <ellipse cx="-8" cy="36" rx="3" ry="12" fill="#08090c" stroke="#e5dfd3" stroke-width="1.5"/>
    <ellipse cx="-7" cy="36" rx="1.5" ry="8" fill="#38bdf8" opacity="0.6"/>

    <!-- Viewfinder Top Prism -->
    <polygon points="32,15 42,5 56,5 64,15" fill="#15171c" stroke="rgba(255,255,255,0.2)"/>

    <!-- Orange Tether Cable Snaking Down -->
    <path d="M12 45 Q-15 80 15 130 T60 170" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Live Tethering Workstation Monitor (Bottom Left) -->
  <g transform="translate(110, 150)">
    <!-- Stand -->
    <rect x="42" y="70" width="8" height="35" fill="#252830"/>
    <rect x="25" y="103" width="42" height="6" rx="2" fill="#1c1e24"/>
    
    <!-- Monitor Bezel -->
    <rect x="0" y="0" width="92" height="70" rx="6" fill="#121317" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.7))"/>
    
    <!-- Screen (Live Capture One feed) -->
    <rect x="5" y="5" width="82" height="60" rx="3" fill="#0a0b0d"/>
    <rect x="8" y="8" width="58" height="46" rx="2" fill="#15171e"/>
    
    <!-- Fashion Model Wireframe in View -->
    <circle cx="37" cy="22" r="7" fill="#e5dfd3"/>
    <path d="M26 48 C26 34 48 34 48 48 Z" fill="#e5dfd3"/>
    
    <!-- Histogram & Metadata Panel on Screen -->
    <rect x="68" y="8" width="16" height="12" fill="#222630"/>
    <polyline points="69,18 73,12 77,15 82,9" fill="none" stroke="#22c55e" stroke-width="1"/>
    
    <text x="8" y="60" fill="#9da3af" font-family="monospace" font-size="5">1/250s · f/8.0 · ISO 64</text>
  </g>

  <!-- Step Badge Overlay -->
  <g transform="translate(26, 246)">
    <rect width="134" height="28" rx="14" fill="rgba(0,0,0,0.7)" stroke="rgba(229,223,211,0.3)" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#e5dfd3"/>
    <text x="28" y="18" fill="#e5dfd3" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1.5">PHASE 03 // PRODUCTION</text>
  </g>
</svg>
