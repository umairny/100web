<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141519"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5dfd3"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGrad4)"/>

  <!-- High-End Retouching Display Screen -->
  <g transform="translate(60, 40)">
    <!-- Stand -->
    <rect x="135" y="150" width="10" height="35" fill="#252830"/>
    <rect x="105" y="180" width="70" height="8" rx="2" fill="#1c1e24"/>

    <!-- Display Frame (Calibrated EIZO / Apple XDR) -->
    <rect width="280" height="155" rx="8" fill="#121317" stroke="rgba(229,223,211,0.3)" stroke-width="1.5" filter="drop-shadow(0 16px 32px rgba(0,0,0,0.8))"/>
    
    <!-- Screen Viewport -->
    <rect x="8" y="8" width="264" height="139" rx="4" fill="#08090c"/>

    <!-- Left: Editorial Magazine Cover Split Preview -->
    <rect x="14" y="14" width="95" height="127" rx="3" fill="#15171d" stroke="rgba(255,255,255,0.1)"/>
    
    <!-- Editorial Cover Mock on Screen -->
    <text x="22" y="32" fill="#e5dfd3" font-family="Cinzel, serif" font-size="12" font-weight="900" letter-spacing="4">VOGUE</text>
    <rect x="22" y="38" width="79" height="78" rx="2" fill="#0e1014"/>
    <!-- Model Portrait Silhouette with Tone Curves -->
    <circle cx="61" cy="65" r="16" fill="#e5dfd3"/>
    <path d="M41 106 C41 85 81 85 81 106 Z" fill="#c5b8a5"/>
    <text x="22" y="127" fill="#9da3af" font-family="monospace" font-size="5.5">PARIS SPECIAL // COUTURE</text>

    <!-- Center/Right: Color Wheels & Frequency Separation Tone Curve -->
    <g transform="translate(120, 14)">
      <!-- Panel Header -->
      <text x="0" y="12" fill="#e5dfd3" font-family="monospace" font-size="7.5" font-weight="bold" letter-spacing="1">COLOR GRADING // RGB CURVES</text>
      
      <!-- Tone Curve Grid Box -->
      <rect x="0" y="20" width="90" height="60" rx="3" fill="#111318" stroke="rgba(255,255,255,0.1)"/>
      <line x1="0" y1="50" x2="90" y2="50" stroke="rgba(255,255,255,0.06)" stroke-dasharray="2 2"/>
      <line x1="45" y1="20" x2="45" y2="80" stroke="rgba(255,255,255,0.06)" stroke-dasharray="2 2"/>
      <!-- S-Curve -->
      <path d="M5 75 Q25 70 45 50 T85 25" fill="none" stroke="url(#curveGrad)" stroke-width="2"/>
      <circle cx="28" cy="66" r="3" fill="#38bdf8"/>
      <circle cx="62" cy="34" r="3" fill="#e5dfd3"/>

      <!-- CMYK Color Balance Indicator Bars -->
      <g transform="translate(0, 88)">
        <text x="0" y="7" fill="#9da3af" font-family="monospace" font-size="6">C</text>
        <rect x="12" y="2" width="60" height="5" rx="1.5" fill="#1f2430"/>
        <rect x="12" y="2" width="44" height="5" rx="1.5" fill="#06b6d4"/>

        <text x="0" y="17" fill="#9da3af" font-family="monospace" font-size="6">M</text>
        <rect x="12" y="12" width="60" height="5" rx="1.5" fill="#1f2430"/>
        <rect x="12" y="12" width="52" height="5" rx="1.5" fill="#ec4899"/>

        <text x="0" y="27" fill="#9da3af" font-family="monospace" font-size="6">Y</text>
        <rect x="12" y="22" width="60" height="5" rx="1.5" fill="#1f2430"/>
        <rect x="12" y="22" width="38" height="5" rx="1.5" fill="#eab308"/>

        <text x="0" y="37" fill="#9da3af" font-family="monospace" font-size="6">K</text>
        <rect x="12" y="32" width="60" height="5" rx="1.5" fill="#1f2430"/>
        <rect x="12" y="32" width="58" height="5" rx="1.5" fill="#e5dfd3"/>
      </g>
    </g>

    <!-- Right Tool Palette -->
    <g transform="translate(225, 20)">
      <rect x="0" y="0" width="30" height="120" rx="4" fill="#111317" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="15" cy="15" r="5" fill="#e5dfd3" opacity="0.8"/>
      <circle cx="15" cy="32" r="5" fill="#9da3af" opacity="0.4"/>
      <circle cx="15" cy="49" r="5" fill="#9da3af" opacity="0.4"/>
      <circle cx="15" cy="66" r="5" fill="#9da3af" opacity="0.4"/>
      <circle cx="15" cy="83" r="5" fill="#9da3af" opacity="0.4"/>
      <circle cx="15" cy="100" r="5" fill="#9da3af" opacity="0.4"/>
    </g>
  </g>

  <!-- Step Badge Overlay -->
  <g transform="translate(26, 246)">
    <rect width="138" height="28" rx="14" fill="rgba(0,0,0,0.7)" stroke="rgba(229,223,211,0.3)" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#e5dfd3"/>
    <text x="28" y="18" fill="#e5dfd3" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1.5">PHASE 04 // MASTER RETOUCH</text>
  </g>
</svg>
