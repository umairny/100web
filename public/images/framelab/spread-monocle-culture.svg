<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <filter id="spreadShadowMonocle" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="rgba(0,0,0,0.65)"/>
    </filter>
    <linearGradient id="pageFoldMonocle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dedad0"/>
      <stop offset="47%" stop-color="#fcfbfa"/>
      <stop offset="50%" stop-color="#b6b0a4"/>
      <stop offset="53%" stop-color="#fcfbfa"/>
      <stop offset="100%" stop-color="#dedad0"/>
    </linearGradient>
  </defs>

  <rect width="700" height="480" rx="16" fill="#0d0e12"/>

  <!-- Studio Surface Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="120" x2="700" y2="120"/>
    <line x1="0" y1="240" x2="700" y2="240"/>
    <line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="350" y1="0" x2="350" y2="480"/>
  </g>

  <!-- Open Magazine Double-Page Spread -->
  <g transform="translate(45, 30)" filter="url(#spreadShadowMonocle)">
    <rect x="0" y="0" width="610" height="420" rx="6" fill="url(#pageFoldMonocle)"/>
    <rect x="5" y="5" width="298" height="410" fill="#faf8f5"/>
    <rect x="307" y="5" width="298" height="410" fill="#faf8f5"/>

    <!-- Center Crease -->
    <line x1="305" y1="0" x2="305" y2="420" stroke="#9e988c" stroke-width="1.5" opacity="0.6"/>

    <!-- ================= LEFT PAGE: SWISS MINIMALIST ESSAY ================= -->
    <g transform="translate(30, 30)">
      <text x="0" y="16" fill="#181716" font-family="Cinzel, serif" font-size="11" font-weight="900" letter-spacing="4">MONOCLE QUARTERLY</text>
      <text x="180" y="16" fill="#68635c" font-family="monospace" font-size="8">ZÜRICH // REPORT 118</text>
      <line x1="0" y1="25" x2="250" y2="25" stroke="#181716" stroke-width="1"/>

      <!-- Essay Headline -->
      <text x="0" y="65" fill="#181716" font-family="Playfair Display, Georgia, serif" font-size="28" font-weight="900">ARCHITECTURAL</text>
      <text x="0" y="96" fill="#181716" font-family="Playfair Display, Georgia, serif" font-size="28" font-weight="900" font-style="italic">PROPORTIONS</text>

      <text x="0" y="122" fill="#68635c" font-family="Cinzel, serif" font-size="9" font-weight="bold" letter-spacing="2">ESSAY BY HELENA BERG</text>

      <!-- Quote Box -->
      <g transform="translate(0, 142)">
        <rect x="0" y="0" width="248" height="74" fill="#ede8df" rx="4"/>
        <line x1="0" y1="0" x2="0" y2="74" stroke="#181716" stroke-width="3"/>
        <text x="14" y="24" fill="#181716" font-family="Playfair Display, serif" font-size="11" font-style="italic">"Their medium-format imagery</text>
        <text x="14" y="42" fill="#181716" font-family="Playfair Display, serif" font-size="11" font-style="italic">transforms standard fashion spreads</text>
        <text x="14" y="60" fill="#181716" font-family="Playfair Display, serif" font-size="11" font-style="italic">into permanent cultural archives."</text>
      </g>

      <!-- 2-Column Body Paragraphs Mock -->
      <g transform="translate(0, 236)" fill="#68635c" font-family="serif" font-size="6.5" opacity="0.85">
        <text x="0" y="0">Visual culture demands restraint in an age</text>
        <text x="0" y="10">of relentless digital noise. FrameLab Photo</text>
        <text x="0" y="20">champions geometric balance, natural raking light,</text>
        <text x="0" y="30">and archival discipline across print tearsheets.</text>

        <text x="130" y="0">Photographed on Phase One IQ4 150MP.</text>
        <text x="130" y="10">Monochrome balance, analog silver gelatin</text>
        <text x="130" y="20">emulation, and stone pigments.</text>
        <text x="130" y="30">Zurich / Milan Cultural Report.</text>
      </g>

      <text x="0" y="340" fill="#9da3af" font-family="monospace" font-size="8">P. 62 // MONOCLE DESIGN REPORT</text>
    </g>

    <!-- ================= RIGHT PAGE: ARCHITECTURAL COLUMNS PHOTOGRAPHY ================= -->
    <g transform="translate(325, 20)">
      <rect x="0" y="0" width="260" height="375" rx="3" fill="#121318" stroke="#181716" stroke-width="1.5"/>

      <!-- Classical Architectural Fluted Columns Vector -->
      <g stroke="#262933" stroke-width="3">
        <line x1="30" y1="0" x2="30" y2="375"/>
        <line x1="45" y1="0" x2="45" y2="375"/>
        <line x1="60" y1="0" x2="60" y2="375"/>
        
        <line x1="200" y1="0" x2="200" y2="375"/>
        <line x1="215" y1="0" x2="215" y2="375"/>
        <line x1="230" y1="0" x2="230" y2="375"/>
      </g>

      <!-- Center Shadowy High-Fashion Model -->
      <ellipse cx="130" cy="85" rx="16" ry="22" fill="#e5dfd3"/>
      <!-- Structured Coat -->
      <polygon points="105,107 155,107 175,340 85,340" fill="#1e2028"/>
      <polygon points="115,107 130,160 125,107" fill="#c5b8a5"/>
      <polygon points="145,107 130,160 135,107" fill="#c5b8a5"/>

      <!-- Ambient Architectural Light Beam -->
      <polygon points="70,0 190,0 240,375 20,375" fill="rgba(229,223,211,0.06)"/>

      <!-- Overlay Caption -->
      <rect x="15" y="325" width="230" height="35" rx="2" fill="rgba(0,0,0,0.75)"/>
      <text x="25" y="340" fill="#e5dfd3" font-family="Cinzel, serif" font-size="7.5" font-weight="bold">THE PALLADIAN PERSPECTIVE</text>
      <text x="25" y="352" fill="#9da3af" font-family="monospace" font-size="6">PHASE ONE IQ4 · SCHNEIDER 55MM · MILAN</text>

      <text x="220" y="386" fill="#9da3af" font-family="monospace" font-size="8">63</text>
    </g>
  </g>
</svg>
