<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <filter id="spreadShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="rgba(0,0,0,0.65)"/>
    </filter>
    <linearGradient id="pageFold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dedad1"/>
      <stop offset="47%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#b8b2a5"/>
      <stop offset="53%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#dedad1"/>
    </linearGradient>
    <linearGradient id="silkGownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2927"/>
      <stop offset="50%" stop-color="#121110"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <!-- Surface Mat Background -->
  <rect width="700" height="480" rx="16" fill="#0d0e12"/>
  
  <!-- Subtle Studio Surface Texture Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="120" x2="700" y2="120"/>
    <line x1="0" y1="240" x2="700" y2="240"/>
    <line x1="0" y1="360" x2="700" y2="360"/>
    <line x1="175" y1="0" x2="175" y2="480"/>
    <line x1="350" y1="0" x2="350" y2="480"/>
    <line x1="525" y1="0" x2="525" y2="480"/>
  </g>

  <!-- Open Magazine Double-Page Spread -->
  <g transform="translate(45, 30)" filter="url(#spreadShadow)">
    <!-- Base Paper Pages with Center Spine Shadow -->
    <rect x="0" y="0" width="610" height="420" rx="6" fill="url(#pageFold)"/>
    <rect x="5" y="5" width="298" height="410" fill="#faf8f4"/>
    <rect x="307" y="5" width="298" height="410" fill="#faf8f4"/>

    <!-- Center Spine Crease Line -->
    <line x1="305" y1="0" x2="305" y2="420" stroke="#9e988c" stroke-width="1.5" opacity="0.6"/>

    <!-- ================= LEFT PAGE: EDITORIAL STORY & TYPOGRAPHY ================= -->
    <g transform="translate(30, 30)">
      <!-- Magazine Masthead Header -->
      <text x="0" y="16" fill="#181716" font-family="Cinzel, serif" font-size="11" font-weight="900" letter-spacing="4">VOGUE EDITORIAL</text>
      <text x="195" y="16" fill="#68635c" font-family="monospace" font-size="8">PARIS // ISSUE 284</text>
      <line x1="0" y1="25" x2="250" y2="25" stroke="#181716" stroke-width="1"/>

      <!-- Editorial Title -->
      <text x="0" y="65" fill="#181716" font-family="Playfair Display, Georgia, serif" font-size="32" font-weight="900" letter-spacing="-0.5">THE SILK</text>
      <text x="0" y="98" fill="#181716" font-family="Playfair Display, Georgia, serif" font-size="32" font-weight="900" font-style="italic">MONOLOGUE</text>
      
      <!-- Sub-headline -->
      <text x="0" y="122" fill="#68635c" font-family="Cinzel, serif" font-size="9" font-weight="600" letter-spacing="2">PHOTOGRAPHY BY FRAMELAB STUDIO</text>
      
      <!-- Editorial Pull Quote -->
      <g transform="translate(0, 142)">
        <rect x="0" y="0" width="248" height="74" fill="#f0ece3" rx="4"/>
        <line x1="0" y1="0" x2="0" y2="74" stroke="#181716" stroke-width="3"/>
        <text x="14" y="24" fill="#181716" font-family="Playfair Display, serif" font-size="12" font-style="italic">"Light does not merely illuminate</text>
        <text x="14" y="42" fill="#181716" font-family="Playfair Display, serif" font-size="12" font-style="italic">the couture form — it sculpts its</text>
        <text x="14" y="60" fill="#181716" font-family="Playfair Display, serif" font-size="12" font-style="italic">very soul on medium format."</text>
      </g>

      <!-- 2-Column Body Paragraphs Mock -->
      <g transform="translate(0, 236)" fill="#68635c" font-family="serif" font-size="6.5" opacity="0.85">
        <text x="0" y="0">In the hushed quarters of Studio 01 in Paris,</text>
        <text x="0" y="10">the kinetic movement of heavy silk drapery</text>
        <text x="0" y="20">captures an emotional resonance that transcends</text>
        <text x="0" y="30">commercial conventions. Every shutter release</text>
        <text x="0" y="40">at 1/250s locks in an unrepeatable gesture.</text>

        <text x="130" y="0">Through precision strobe ratios and Hasselblad</text>
        <text x="130" y="10">100MP optical resolution, tactile microfiber</text>
        <text x="130" y="20">weaves and architectural silhouettes merge.</text>
        <text x="130" y="30">Art Direction: FrameLab Studio Atelier.</text>
        <text x="130" y="40">Styling: Maison de Haute Couture Paris.</text>
      </g>

      <!-- Page Number -->
      <text x="0" y="340" fill="#9da3af" font-family="monospace" font-size="8">P. 142 // VOGUE INTERNATIONAL</text>
    </g>

    <!-- ================= RIGHT PAGE: FULL BLEED HERO PHOTOGRAPHY ================= -->
    <g transform="translate(325, 20)">
      <!-- Large Photo Frame -->
      <rect x="0" y="0" width="260" height="375" rx="3" fill="url(#silkGownGrad)" stroke="#181716" stroke-width="1.5"/>
      
      <!-- Studio Lighting Dramatic Silhouette Vector -->
      <!-- Soft ambient backdrop light -->
      <ellipse cx="130" cy="180" rx="90" ry="140" fill="rgba(229,223,211,0.18)"/>

      <!-- Model Head & Face Contour -->
      <ellipse cx="130" cy="95" rx="24" ry="32" fill="#e5dfd3"/>
      <!-- Classical Hair Bun / Silhouette -->
      <ellipse cx="130" cy="80" rx="20" ry="18" fill="#181716"/>
      <!-- High-Fashion Jawline & Neck -->
      <polygon points="120,120 140,120 136,155 124,155" fill="#d8cfbf"/>

      <!-- Flowing Kinetic Silk Drapery Vector Art -->
      <path d="M110 155 Q50 210 30 360 L230 360 Q210 230 150 155 Z" fill="#0d0e11"/>
      <path d="M125 155 Q80 230 70 360" stroke="rgba(229,223,211,0.4)" stroke-width="2.5" fill="none"/>
      <path d="M135 155 Q130 250 130 360" stroke="rgba(229,223,211,0.3)" stroke-width="2" fill="none"/>
      <path d="M145 155 Q180 240 190 360" stroke="rgba(229,223,211,0.4)" stroke-width="2.5" fill="none"/>

      <!-- Photo Caption Overlay -->
      <rect x="15" y="325" width="230" height="35" rx="2" fill="rgba(0,0,0,0.7)" backdrop-filter="blur(4px)"/>
      <text x="25" y="340" fill="#e5dfd3" font-family="Cinzel, serif" font-size="7.5" font-weight="bold">LOOK 04 // BLACK SATIN CHANTILLY</text>
      <text x="25" y="352" fill="#9da3af" font-family="monospace" font-size="6">CAPTURE ONE PRO // HASSELBLAD DIGITAL BACK</text>

      <!-- Right Page Number -->
      <text x="220" y="386" fill="#9da3af" font-family="monospace" font-size="8">143</text>
    </g>
  </g>
</svg>
