<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#BAE6FD" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="dashShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <filter id="floatCardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>

    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="390" cy="240" rx="360" ry="210" fill="url(#heroGlow)" />

  <!-- ============================================================ -->
  <!-- MAIN DASHBOARD WINDOW (Width: 520, Height: 340)              -->
  <!-- ============================================================ -->
  <g transform="translate(130, 60)" filter="url(#dashShadow)">
    <rect x="0" y="0" width="520" height="340" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Top Window Chrome / Header -->
    <rect x="0" y="0" width="520" height="36" rx="16" fill="#FFFFFF" />
    <rect x="0" y="20" width="520" height="16" fill="#FFFFFF" />
    <line x1="0" y1="36" x2="520" y2="36" stroke="#F1F5F9" stroke-width="1" />

    <!-- Search in Header -->
    <rect x="145" y="8" width="170" height="20" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="157" cy="18" r="3.5" stroke="#94A3B8" stroke-width="1" fill="none" />
    <line x1="159.5" y1="20.5" x2="163" y2="24" stroke="#94A3B8" stroke-width="1" />
    <text x="170" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Search policies, records...</text>

    <!-- User Avatar & Status -->
    <circle cx="490" cy="18" r="9" fill="#059669" />
    <text x="490" y="21" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">CL</text>

    <!-- ==================== LEFT SIDEBAR ==================== -->
    <g>
      <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 125 0 L 125 340 L 16 340 C 7.16 340 0 332.84 0 324 Z" fill="#0F172A" />

      <!-- Brand Logo in Sidebar -->
      <g transform="translate(14, 14)">
        <circle cx="8" cy="6" r="6" stroke="#38BDF8" stroke-width="2" fill="none" />
        <circle cx="8" cy="6" r="2.5" fill="#10B981" />
        <text x="20" y="10" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">ConsentLayer</text>
      </g>

      <!-- Nav Items -->
      <g transform="translate(10, 48)">
        <!-- Dashboard active -->
        <rect x="0" y="0" width="105" height="24" rx="6" fill="#1E293B" />
        <circle cx="10" cy="12" r="3" fill="#10B981" />
        <text x="20" y="15" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Dashboard</text>

        <g transform="translate(0, 30)">
          <circle cx="10" cy="8" r="2.5" fill="#64748B" />
          <text x="20" y="11" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Consent Banners</text>
        </g>
        <g transform="translate(0, 52)">
          <circle cx="10" cy="8" r="2.5" fill="#64748B" />
          <text x="20" y="11" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Preferences</text>
        </g>
        <g transform="translate(0, 74)">
          <circle cx="10" cy="8" r="2.5" fill="#64748B" />
          <text x="20" y="11" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Privacy Policies</text>
        </g>
        <g transform="translate(0, 96)">
          <circle cx="10" cy="8" r="2.5" fill="#64748B" />
          <text x="20" y="11" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Audit Logs</text>
        </g>
        <g transform="translate(0, 118)">
          <circle cx="10" cy="8" r="2.5" fill="#64748B" />
          <text x="20" y="11" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Settings</text>
        </g>
      </g>
    </g>

    <!-- ==================== MAIN DASHBOARD BODY ==================== -->
    <g transform="translate(138, 48)">
      <!-- Metric Banner: Total Opt-In Rate -->
      <g>
        <rect x="0" y="0" width="180" height="84" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="18" fill="#64748B" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-transform="uppercase">Global Opt-in Rate</text>
        <text x="12" y="44" fill="#0F172A" font-family="system-ui, sans-serif" font-size="22" font-weight="900">94.2%</text>
        <text x="12" y="58" fill="#16A34A" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">↑ +6.8% vs industry avg</text>
        <path d="M 12 72 L 50 68 L 90 70 L 130 62 L 165 58" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" />
      </g>

      <!-- Analytics Bar Chart -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="180" height="84" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="18" fill="#64748B" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">Jurisdiction Distribution</text>
        <!-- Bar groups -->
        <g transform="translate(20, 24)">
          <rect x="0" y="18" width="16" height="34" rx="3" fill="url(#barGrad1)" />
          <text x="8" y="60" fill="#64748B" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">EU</text>

          <rect x="28" y="10" width="16" height="42" rx="3" fill="url(#barGrad2)" />
          <text x="36" y="60" fill="#64748B" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">US</text>

          <rect x="56" y="22" width="16" height="30" rx="3" fill="url(#barGrad1)" />
          <text x="64" y="60" fill="#64748B" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">UK</text>

          <rect x="84" y="8" width="16" height="44" rx="3" fill="url(#barGrad2)" />
          <text x="92" y="60" fill="#64748B" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">APAC</text>

          <rect x="112" y="16" width="16" height="36" rx="3" fill="url(#barGrad1)" />
          <text x="120" y="60" fill="#64748B" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">BR</text>
        </g>
      </g>

      <!-- Background records preview -->
      <g transform="translate(0, 94)">
        <rect x="0" y="0" width="370" height="186" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="14" y="20" fill="#0F172A" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Active Domain Consent Telemetry</text>

        <!-- Domain Item 1 -->
        <g transform="translate(14, 32)">
          <circle cx="8" cy="8" r="4" fill="#10B981" />
          <text x="18" y="11" fill="#0F172A" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">acme-store.com</text>
          <text x="120" y="11" fill="#64748B" font-family="system-ui, sans-serif" font-size="7">GDPR + CCPA Banner Active</text>
          <text x="240" y="11" fill="#10B981" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">98.1% Passing</text>
        </g>
        <line x1="14" y1="52" x2="356" y2="52" stroke="#F1F5F9" stroke-width="1" />

        <!-- Domain Item 2 -->
        <g transform="translate(14, 62)">
          <circle cx="8" cy="8" r="4" fill="#10B981" />
          <text x="18" y="11" fill="#0F172A" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">app.cloudscale.io</text>
          <text x="120" y="11" fill="#64748B" font-family="system-ui, sans-serif" font-size="7">SDK v4.2 • Mobile Ingest</text>
          <text x="240" y="11" fill="#10B981" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">100% Passing</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- FLOATING CARD 1: COOKIE BANNER (Left foreground)             -->
  <!-- ============================================================ -->
  <g transform="translate(60, 240)" filter="url(#floatCardShadow)">
    <rect x="0" y="0" width="220" height="135" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" />

    <!-- Card Header with Cookie Icon -->
    <g transform="translate(14, 14)">
      <circle cx="10" cy="10" r="10" fill="#FDE68A" />
      <text x="10" y="13.5" font-size="11" text-anchor="middle">🍪</text>
      <text x="26" y="13" fill="#92400E" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Cookie Banner</text>
      <rect x="135" y="2" width="48" height="14" rx="7" fill="#FEF3C7" />
      <text x="159" y="12" fill="#B45309" font-family="system-ui, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">Preview</text>
    </g>

    <text x="14" y="48" fill="#78350F" font-family="system-ui, sans-serif" font-size="8" leading="1.2">
      We respect your privacy choices under GDPR &amp; CCPA.
    </text>
    <text x="14" y="60" fill="#92400E" font-family="system-ui, sans-serif" font-size="7.5" opacity="0.8">
      Manage your personalized cookie preferences.
    </text>

    <!-- Action Buttons -->
    <g transform="translate(14, 76)">
      <rect x="0" y="0" width="60" height="20" rx="6" fill="#059669" />
      <text x="30" y="13" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Accept All</text>

      <rect x="66" y="0" width="60" height="20" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1" />
      <text x="96" y="13" fill="#92400E" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Preferences</text>

      <rect x="132" y="0" width="58" height="20" rx="6" fill="#F3F4F6" />
      <text x="161" y="13" fill="#4B5563" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Decline</text>
    </g>

    <!-- Verified Badge -->
    <g transform="translate(14, 108)">
      <text x="0" y="12" fill="#059669" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">✓ Instant One-Click Script Deployment</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- FLOATING CARD 2: PREFERENCE CENTER (Right top foreground)    -->
  <!-- ============================================================ -->
  <g transform="translate(480, 180)" filter="url(#floatCardShadow)">
    <rect x="0" y="0" width="220" height="120" rx="14" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" />

    <g transform="translate(14, 14)">
      <circle cx="8" cy="8" r="8" fill="#E0F2FE" />
      <text x="8" y="11" font-size="9" text-anchor="middle">⚙</text>
      <text x="22" y="11" fill="#0369A1" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">Preference Center</text>
    </g>

    <!-- Toggles -->
    <g transform="translate(14, 38)">
      <!-- Essential (Locked) -->
      <g>
        <text x="0" y="10" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Strictly Necessary</text>
        <rect x="145" y="0" width="34" height="16" rx="8" fill="#10B981" />
        <circle cx="169" cy="8" r="6" fill="#FFFFFF" />
      </g>

      <!-- Analytics -->
      <g transform="translate(0, 22)">
        <text x="0" y="10" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Analytics &amp; Performance</text>
        <rect x="145" y="0" width="34" height="16" rx="8" fill="#0284C7" />
        <circle cx="169" cy="8" r="6" fill="#FFFFFF" />
      </g>

      <!-- Marketing -->
      <g transform="translate(0, 44)">
        <text x="0" y="10" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Targeted Advertising</text>
        <rect x="145" y="0" width="34" height="16" rx="8" fill="#E2E8F0" />
        <circle cx="153" cy="8" r="6" fill="#94A3B8" />
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- FLOATING CARD 3: AUDIT TRAILS (Right bottom foreground)      -->
  <!-- ============================================================ -->
  <g transform="translate(510, 315)" filter="url(#floatCardShadow)">
    <rect x="0" y="0" width="190" height="115" rx="12" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.5" />

    <g transform="translate(12, 12)">
      <circle cx="8" cy="8" r="8" fill="#DCFCE7" />
      <text x="8" y="11" font-size="8" text-anchor="middle">🛡</text>
      <text x="20" y="11" fill="#15803D" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">Audit Trails</text>
    </g>

    <!-- Checklist items -->
    <g transform="translate(12, 34)">
      <g>
        <circle cx="6" cy="6" r="5" fill="#10B981" />
        <path d="M 4 6 L 5.5 7.5 L 8 4.5" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" />
        <text x="16" y="8" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">Consent Token #49102</text>
        <text x="16" y="16" fill="#64748B" font-family="system-ui, sans-serif" font-size="6">Hash: 8f4a...29b • Timestamped</text>
      </g>

      <g transform="translate(0, 24)">
        <circle cx="6" cy="6" r="5" fill="#10B981" />
        <path d="M 4 6 L 5.5 7.5 L 8 4.5" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" />
        <text x="16" y="8" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">DSAR Data Erasure Request</text>
        <text x="16" y="16" fill="#64748B" font-family="system-ui, sans-serif" font-size="6">Auto-dispatched to 6 vendors</text>
      </g>

      <g transform="translate(0, 48)">
        <circle cx="6" cy="6" r="5" fill="#10B981" />
        <path d="M 4 6 L 5.5 7.5 L 8 4.5" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" />
        <text x="16" y="8" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">Policy v3.4 Updated</text>
        <text x="16" y="16" fill="#64748B" font-family="system-ui, sans-serif" font-size="6">GDPR Recital 32 compliant</text>
      </g>
    </g>
  </g>
</svg>
