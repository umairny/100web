<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="cloudGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#F0FDF4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="nodeSh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient Cloud Shape Background -->
  <path d="M 80 180 C 80 100 130 50 200 60 C 240 30 300 40 330 80 C 390 70 430 110 420 170 C 450 210 430 280 370 290 C 340 320 270 320 230 290 C 180 310 110 280 100 230 C 70 210 70 190 80 180 Z" fill="url(#cloudGlow)" stroke="#BAE6FD" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Radial Connecting Lines from Center (240, 180) -->
  <g stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round">
    <!-- To WordPress (Top Left) -->
    <line x1="240" y1="180" x2="160" y2="100" stroke-dasharray="4 3" />
    <!-- To Shopify (Top Mid-Left) -->
    <line x1="240" y1="180" x2="220" y2="90" />
    <!-- To Salesforce (Top Right) -->
    <line x1="240" y1="180" x2="340" y2="110" stroke-dasharray="4 3" />
    <!-- To HubSpot (Mid Right) -->
    <line x1="240" y1="180" x2="370" y2="180" />
    <!-- To Segment (Bottom Right) -->
    <line x1="240" y1="180" x2="330" y2="260" stroke-dasharray="4 3" />
    <!-- To Google (Bottom Center) -->
    <line x1="240" y1="180" x2="240" y2="280" />
    <!-- To Stripe (Bottom Left) -->
    <line x1="240" y1="180" x2="145" y2="255" stroke-dasharray="4 3" />
    <!-- To PayPal (Mid Left) -->
    <line x1="240" y1="180" x2="120" y2="180" />
  </g>

  <!-- ==================== LOGO NODES ==================== -->
  <!-- 1. WordPress (Top Left) -->
  <g transform="translate(160, 100)" filter="url(#nodeSh)">
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="0" cy="0" r="13" fill="#21759B" />
    <text x="0" y="4" fill="#FFFFFF" font-family="serif" font-size="12" font-weight="bold" text-anchor="middle">W</text>
  </g>

  <!-- 2. Shopify (Top Mid-Left) -->
  <g transform="translate(220, 90)" filter="url(#nodeSh)">
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="0" cy="0" r="13" fill="#95BF47" />
    <text x="0" y="4" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">S</text>
  </g>

  <!-- 3. Salesforce (Top Right) -->
  <g transform="translate(340, 110)" filter="url(#nodeSh)">
    <circle cx="0" cy="0" r="19" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="0" cy="0" r="14" fill="#00A1E0" />
    <text x="0" y="4" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">☁</text>
  </g>

  <!-- 4. HubSpot (Mid Right) -->
  <g transform="translate(370, 180)" filter="url(#nodeSh)">
    <circle cx="0" cy="0" r="19" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="0" cy="0" r="14" fill="#FF7A59" />
    <text x="0" y="4" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">H</text>
  </g>

  <!-- 5. Segment (Bottom Right) -->
  <g transform="translate(330, 260)" filter="url(#nodeSh)">
    <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="-18" cy="0" r="5" fill="#52BD95" />
    <text x="5" y="4" fill="#1E293B" font-family="sans-serif" font-size="9" font-weight="bold">Segment</text>
  </g>

  <!-- 6. Google Analytics / GTM (Bottom Center) -->
  <g transform="translate(240, 280)" filter="url(#nodeSh)">
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="-8" y="2" width="4" height="8" rx="1" fill="#F9AB00" />
    <rect x="-2" y="-3" width="4" height="13" rx="1" fill="#F9AB00" />
    <rect x="4" y="-8" width="4" height="18" rx="1" fill="#E37400" />
  </g>

  <!-- 7. Stripe (Bottom Left) -->
  <g transform="translate(145, 255)" filter="url(#nodeSh)">
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="0" y="5" fill="#635BFF" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">S</text>
  </g>

  <!-- 8. PayPal (Mid Left) -->
  <g transform="translate(120, 180)" filter="url(#nodeSh)">
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="0" y="5" fill="#003087" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">P</text>
  </g>

  <!-- ==================== CENTRAL CONSENTLAYER HUB ==================== -->
  <g transform="translate(240, 180)" filter="url(#nodeSh)">
    <!-- Outer Cyan Ring -->
    <circle cx="0" cy="0" r="32" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
    <!-- Inner Glowing Arc -->
    <circle cx="0" cy="0" r="24" stroke="#10B981" stroke-width="2.5" stroke-dasharray="12 4" />
    <!-- Center 'C' Emblem -->
    <path d="M 6 -10 C -8 -10 -12 -2 -12 0 C -12 2 -8 10 6 10" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="0" cy="0" r="3.5" fill="#10B981" />
  </g>
</svg>
