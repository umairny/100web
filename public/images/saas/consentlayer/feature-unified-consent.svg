<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%" fill="none">
  <defs>
    <filter id="featSh1" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.15" />
    </filter>
  </defs>

  <g transform="translate(80, 70)" filter="url(#featSh1)">
    <!-- Base Rounded Shield / Window -->
    <rect x="-50" y="-45" width="100" height="90" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <rect x="-50" y="-45" width="100" height="22" rx="14" fill="#E0F2FE" />
    <circle cx="-35" cy="-34" r="3" fill="#0284C7" />
    <circle cx="-25" cy="-34" r="3" fill="#38BDF8" />

    <!-- 3 Layered Consent Sliders -->
    <g transform="translate(-36, -12)">
      <!-- Row 1 -->
      <line x1="0" y1="6" x2="52" y2="6" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="6" x2="38" y2="6" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
      <circle cx="38" cy="6" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
      <text x="60" y="9" fill="#0F172A" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">WEB</text>

      <!-- Row 2 -->
      <g transform="translate(0, 20)">
        <line x1="0" y1="6" x2="52" y2="6" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
        <line x1="0" y1="6" x2="44" y2="6" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
        <circle cx="44" cy="6" r="6" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.5" />
        <text x="60" y="9" fill="#0F172A" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">APP</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 40)">
        <line x1="0" y1="6" x2="52" y2="6" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
        <line x1="0" y1="6" x2="28" y2="6" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
        <circle cx="28" cy="6" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
        <text x="60" y="9" fill="#0F172A" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">API</text>
      </g>
    </g>
  </g>
</svg>
