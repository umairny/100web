<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%" fill="none">
  <defs>
    <filter id="wfSh1" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.15" />
    </filter>
  </defs>

  <g transform="translate(80, 70)" filter="url(#wfSh1)">
    <!-- Central Database Stack -->
    <g transform="translate(0, -5)">
      <rect x="-24" y="-20" width="48" height="12" rx="4" fill="#0284C7" />
      <circle cx="16" cy="-14" r="2" fill="#34D399" />
      <rect x="-24" y="-4" width="48" height="12" rx="4" fill="#0284C7" />
      <circle cx="16" cy="2" r="2" fill="#34D399" />
      <rect x="-24" y="12" width="48" height="12" rx="4" fill="#0284C7" />
      <circle cx="16" cy="18" r="2" fill="#34D399" />
    </g>

    <!-- Radiating Connected Nodes -->
    <!-- Top Left: Web -->
    <path d="M -24 -14 L -45 -30" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="3 2" />
    <circle cx="-50" cy="-34" r="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5" />
    <text x="-50" y="-31" font-size="8" text-anchor="middle">🌐</text>

    <!-- Top Right: Mobile -->
    <path d="M 24 -14 L 45 -30" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="3 2" />
    <circle cx="50" cy="-34" r="10" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5" />
    <text x="-50" y="-31" font-size="8" text-anchor="middle"></text>
    <text x="50" y="-31" font-size="8" text-anchor="middle">📱</text>

    <!-- Bottom Left: CRM -->
    <path d="M -24 18 L -45 34" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="3 2" />
    <circle cx="-50" cy="38" r="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" />
    <text x="-50" y="41" font-size="8" text-anchor="middle">👥</text>

    <!-- Bottom Right: Cloud API -->
    <path d="M 24 18 L 45 34" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="3 2" />
    <circle cx="50" cy="38" r="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5" />
