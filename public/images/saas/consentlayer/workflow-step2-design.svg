<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%" fill="none">
  <defs>
    <filter id="wfSh2" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <g transform="translate(80, 70)" filter="url(#wfSh2)">
    <!-- Browser Wireframe Screen -->
    <rect x="-55" y="-45" width="110" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="-55" y="-45" width="110" height="16" rx="10" fill="#F1F5F9" />
    <circle cx="-45" cy="-37" r="2.5" fill="#EF4444" />
    <circle cx="-38" cy="-37" r="2.5" fill="#F59E0B" />
    <circle cx="-31" cy="-37" r="2.5" fill="#10B981" />

    <!-- Website dummy text lines -->
    <rect x="-45" y="-20" width="60" height="4" rx="2" fill="#E2E8F0" />
    <rect x="-45" y="-12" width="75" height="3" rx="1.5" fill="#F1F5F9" />
    <rect x="-45" y="-5" width="50" height="3" rx="1.5" fill="#F1F5F9" />

    <!-- Cookie Consent Banner Box overlaid on bottom -->
    <g transform="translate(0, 20)">
      <rect x="-48" y="-14" width="96" height="32" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2" />
      <circle cx="-38" cy="2" r="5" fill="#FDE68A" />
      <text x="-38" y="4.5" font-size="6" text-anchor="middle">🍪</text>
      <rect x="-30" y="-4" width="60" height="3" rx="1.5" fill="#92400E" />
      <!-- Accept button -->
      <rect x="0" y="4" width="22" height="10" rx="3" fill="#10B981" />
      <text x="11" y="11" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="5" font-weight="bold" text-anchor="middle">Accept</text>
      <!-- Manage button -->
      <rect x="25" y="4" width="20" height="10" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
      <text x="35" y="11" fill="#475569" font-family="system-ui, sans-serif" font-size="5" text-anchor="middle">Edit</text>
    </g>
  </g>
</svg>
