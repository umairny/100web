<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="100%" height="100%" fill="none">
  <defs>
    <filter id="wfSh4" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.15" />
    </filter>
  </defs>

  <g transform="translate(80, 70)" filter="url(#wfSh4)">
    <!-- Radar Scanner Base Scope -->
    <circle cx="0" cy="0" r="42" fill="#061E2D" stroke="#0284C7" stroke-width="2" />
    <circle cx="0" cy="0" r="28" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="0" cy="0" r="14" stroke="#0284C7" stroke-opacity="0.5" stroke-width="1.2" />

    <!-- Crosshairs -->
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1" />
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1" />

    <!-- Sweeping Radar Line -->
    <line x1="0" y1="0" x2="26" y2="-28" stroke="#34D399" stroke-width="2" />

    <!-- Compliance Blips -->
    <circle cx="16" cy="-14" r="3.5" fill="#34D399" />
    <circle cx="-18" cy="12" r="2.5" fill="#38BDF8" />
    <circle cx="18" cy="18" r="2" fill="#34D399" />

    <!-- Mini Compliance Donut / Pie Chart on top right -->
    <g transform="translate(36, -26)">
      <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <path d="M 0 0 L 0 -11 A 11 11 0 0 1 11 0 Z" fill="#10B981" />
      <path d="M 0 0 L 11 0 A 11 11 0 1 1 0 -11 Z" fill="#38BDF8" />
    </g>
  </g>
</svg>
