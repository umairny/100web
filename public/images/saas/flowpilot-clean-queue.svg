<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" fill="none">
  <!-- Card Container with Soft Shadow -->
  <defs>
    <filter id="softGlow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0E7490" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="flowBg" x1="0" y1="0" x2="600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FDFF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="primaryBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <rect width="600" height="420" rx="16" fill="url(#flowBg)" stroke="#BAE6FD" stroke-width="1.5" filter="url(#softGlow)"/>

  <!-- Top App Header -->
  <rect width="600" height="54" rx="16" fill="#FFFFFF"/>
  <rect y="40" width="600" height="14" fill="#FFFFFF"/>
  <line x1="0" y1="54" x2="600" y2="54" stroke="#E0F2FE" stroke-width="1.5"/>

  <!-- FlowPilot Brand Mark & Queue Title -->
  <g transform="translate(24, 15)">
    <!-- Flow Leaf Icon -->
    <path d="M0 18C4 8 12 2 22 0C20 10 14 16 4 20C1 20 0 19 0 18Z" fill="#14B8A6"/>
    <path d="M6 22C14 14 20 10 28 8C25 17 18 22 8 24C6 24 6 23 6 22Z" fill="#0284C7"/>
    <text x="36" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#082F49" font-weight="800">FlowPilot</text>
    <text x="96" y="16" font-family="sans-serif" font-size="12" fill="#64748B" font-weight="500">/ Today's Action Queue</text>
  </g>

  <!-- Calm Flow Status Pill -->
  <g transform="translate(380, 12)">
    <rect width="195" height="30" rx="15" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <circle cx="16" cy="15" r="4" fill="#10B981"/>
    <text x="26" y="19" font-family="sans-serif" font-size="10.5" fill="#065F46" font-weight="700">In Flow: 3 Prioritized Next Steps</text>
  </g>

  <!-- Flow Queue List -->
  <g transform="translate(24, 72)">
    <!-- Queue Item 1: High Priority Gold/Teal -->
    <g transform="translate(0, 0)">
      <rect width="552" height="74" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="74" rx="3" fill="#14B8A6"/>
      
      <!-- Rank Pill -->
      <rect x="18" y="24" width="28" height="26" rx="6" fill="#F0FDFA"/>
      <text x="24" y="41" font-family="sans-serif" font-size="11" fill="#0F766E" font-weight="800">01</text>

      <!-- Avatar -->
      <circle cx="72" cy="37" r="18" fill="#E0F2FE"/>
      <text x="64" y="41" font-family="sans-serif" font-size="11" fill="#0369A1" font-weight="700">JD</text>
      <circle cx="84" cy="46" r="5" fill="#10B981" stroke="#FFF" stroke-width="1.5"/>

      <!-- Details -->
      <text x="104" y="30" font-family="sans-serif" font-size="13" fill="#082F49" font-weight="800">Follow up with John D. <tspan fill="#64748B" font-weight="500">· VP Sales at FinTech Corp</tspan></text>
      <text x="104" y="48" font-family="sans-serif" font-size="11" fill="#047857" font-weight="600">Urgent $48,000 Deal <tspan fill="#64748B" font-weight="400">· Reviewed proposal 2h ago · Context ready</tspan></text>

      <!-- Score & Action -->
      <rect x="400" y="24" width="46" height="26" rx="6" fill="#FEF3C7"/>
      <text x="410" y="41" font-family="sans-serif" font-size="11" fill="#B45309" font-weight="800">9.5</text>
      
      <rect x="456" y="22" width="82" height="30" rx="8" fill="url(#primaryBadge)"/>
      <text x="472" y="41" font-family="sans-serif" font-size="11" fill="#FFFFFF" font-weight="700">Send Email →</text>
    </g>

    <!-- Queue Item 2 -->
    <g transform="translate(0, 86)">
      <rect width="552" height="74" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="74" rx="3" fill="#0284C7"/>
      
      <rect x="18" y="24" width="28" height="26" rx="6" fill="#F0F9FF"/>
      <text x="24" y="41" font-family="sans-serif" font-size="11" fill="#0284C7" font-weight="800">02</text>

      <circle cx="72" cy="37" r="18" fill="#FCE7F3"/>
      <text x="64" y="41" font-family="sans-serif" font-size="11" fill="#BE185D" font-weight="700">SK</text>
      <circle cx="84" cy="46" r="5" fill="#3B82F6" stroke="#FFF" stroke-width="1.5"/>

      <text x="104" y="30" font-family="sans-serif" font-size="13" fill="#082F49" font-weight="800">Review Security Pack with Sarah K. <tspan fill="#64748B" font-weight="500">· CloudScale Ops</tspan></text>
      <text x="104" y="48" font-family="sans-serif" font-size="11" fill="#0284C7" font-weight="600">High Impact $92,000 Deal <tspan fill="#64748B" font-weight="400">· CTO approved specs · Schedule brief sync</tspan></text>

      <rect x="400" y="24" width="46" height="26" rx="6" fill="#FEF3C7"/>
      <text x="410" y="41" font-family="sans-serif" font-size="11" fill="#B45309" font-weight="800">9.3</text>

      <rect x="456" y="22" width="82" height="30" rx="8" fill="#0284C7"/>
      <text x="472" y="41" font-family="sans-serif" font-size="11" fill="#FFFFFF" font-weight="700">Book Call ↗</text>
    </g>

    <!-- Queue Item 3 -->
    <g transform="translate(0, 172)">
      <rect width="552" height="74" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="74" rx="3" fill="#6366F1"/>
      
      <rect x="18" y="24" width="28" height="26" rx="6" fill="#EEF2FF"/>
      <text x="24" y="41" font-family="sans-serif" font-size="11" fill="#4F46E5" font-weight="800">03</text>

      <circle cx="72" cy="37" r="18" fill="#FEF3C7"/>
      <text x="64" y="41" font-family="sans-serif" font-size="11" fill="#B45309" font-weight="700">ML</text>
      <circle cx="84" cy="46" r="5" fill="#10B981" stroke="#FFF" stroke-width="1.5"/>

      <text x="104" y="30" font-family="sans-serif" font-size="13" fill="#082F49" font-weight="800">Re-engage Marcus L. <tspan fill="#64748B" font-weight="500">· Head of Growth at Nexus Inc</tspan></text>
      <text x="104" y="48" font-family="sans-serif" font-size="11" fill="#4F46E5" font-weight="600">Expansion $34,000 Deal <tspan fill="#64748B" font-weight="400">· Trigger: Hiring 5 new reps · Context attached</tspan></text>

      <rect x="400" y="24" width="46" height="26" rx="6" fill="#F1F5F9"/>
      <text x="410" y="41" font-family="sans-serif" font-size="11" fill="#475569" font-weight="800">8.9</text>

      <rect x="456" y="22" width="82" height="30" rx="8" fill="#0F172A"/>
      <text x="472" y="41" font-family="sans-serif" font-size="11" fill="#FFFFFF" font-weight="700">Auto-Ping ⚡</text>
    </g>

    <!-- Queue Item 4: Stalled Warning Signal Detected & Resolved -->
    <g transform="translate(0, 258)">
      <rect width="552" height="68" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="68" rx="3" fill="#0D9488"/>

      <rect x="18" y="21" width="28" height="26" rx="6" fill="#CCFBF1"/>
      <text x="24" y="38" font-family="sans-serif" font-size="11" fill="#0F766E" font-weight="800">04</text>

      <circle cx="72" cy="34" r="18" fill="#E2E8F0"/>
      <text x="64" y="38" font-family="sans-serif" font-size="11" fill="#334155" font-weight="700">ER</text>

      <text x="104" y="27" font-family="sans-serif" font-size="13" fill="#082F49" font-weight="800">Elena R. Renewal Check <tspan fill="#0D9488" font-weight="600">· Health signal recovered</tspan></text>
      <text x="104" y="45" font-family="sans-serif" font-size="11" fill="#64748B">Pre-built executive review sent automatically 10m ago · No action needed today</text>

      <rect x="440" y="20" width="98" height="28" rx="14" fill="#CCFBF1"/>
      <text x="453" y="38" font-family="sans-serif" font-size="10.5" fill="#0F766E" font-weight="700">✓ In Rhythm</text>
    </g>
  </g>
</svg>
