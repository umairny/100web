    <text x="290" y="295" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="700">AMOUNT</text>
    <text x="400" y="295" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="700">GATEWAY</text>
    <text x="500" y="295" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="700">STATUS</text>

    <line x1="30" y1="305" x2="570" y2="305" stroke="#F1F5F9" stroke-width="1" />

    <text x="46" y="328" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="600">#INV-8402</text>
    <text x="140" y="328" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="600">TechCorp Global</text>
    <text x="290" y="328" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="700">$12,450.00</text>
