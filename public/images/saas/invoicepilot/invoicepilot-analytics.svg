    <text x="470" y="103" fill="#0284C7" font-family="sans-serif" font-size="10" font-weight="700">Instant ACH</text>

    <!-- MRR Area Growth Chart -->
    <rect x="30" y="130" width="540" height="130" rx="8" fill="#FAFCFF" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Area gradient -->
    <path d="M45 230 C 120 220, 180 190, 260 180 C 340 170, 420 155, 545 145 L 545 245 L 45 245 Z" fill="url(#areaGrad)" />
    <!-- Line curve -->
    <path d="M45 230 C 120 220, 180 190, 260 180 C 340 170, 420 155, 545 145" stroke="#0284C7" stroke-width="3" fill="none" />
    
    <circle cx="260" cy="180" r="4" fill="#0284C7" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="545" cy="145" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
    
