    <rect x="15" y="15" width="570" height="36" rx="14" fill="#F8FAFC" />
    <circle cx="35" cy="33" r="4" fill="#EF4444" />
    <circle cx="49" cy="33" r="4" fill="#F59E0B" />
    <circle cx="63" cy="33" r="4" fill="#10B981" />
