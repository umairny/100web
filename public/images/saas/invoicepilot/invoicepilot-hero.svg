    <circle cx="30" cy="35" r="23" fill="#ECFDF5" stroke="#10B981" stroke-width="3" />
    <circle cx="30" cy="35" r="14" fill="#FFFFFF" stroke="#059669" stroke-width="3" />
    <!-- Bullseye -->
    <circle cx="30" cy="35" r="6" fill="#059669" />

    <!-- Arrow in bullseye -->
    <line x1="4" y1="9" x2="28" y2="33" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="4,9 0,2 7,5" fill="#EF4444" />
    <polygon points="4,9 8,16 2,12" fill="#EF4444" />
