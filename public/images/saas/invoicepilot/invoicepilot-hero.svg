    <text x="546" y="240" fill="#475569" font-family="sans-serif" font-size="11" font-weight="500">Billing Plans</text>
    <text x="546" y="270" fill="#475569" font-family="sans-serif" font-size="11" font-weight="500">Gateways</text>
