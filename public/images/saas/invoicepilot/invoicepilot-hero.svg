    <polygon points="120,80 50,165 240,40" fill="#BAE6FD" stroke="#0284C7" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Central Fuselage / Fold -->
    <polygon points="120,80 240,40 85,200" fill="#E0F2FE" stroke="#0284C7" stroke-width="2" stroke-linejoin="round" />
    
