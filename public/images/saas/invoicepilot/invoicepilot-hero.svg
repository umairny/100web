    <text x="668" y="196" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="600">MONTHLY RECURRING</text>
    <text x="668" y="222" fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="800">$34,250.00</text>
    <rect x="668" y="228" width="46" height="12" rx="4" fill="#DCFCE7" />
    <text x="672" y="237" fill="#166534" font-family="sans-serif" font-size="8" font-weight="700">+18.4% MoM</text>

    <!-- KPI 2: ARR -->
    <rect x="778" y="178" width="112" height="66" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="790" y="196" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="600">ANNUAL RUN-RATE</text>
    <text x="790" y="222" fill="#0F172A" font-family="sans-serif" font-size="15" font-weight="800">$412,890.00</text>
    <text x="790" y="237" fill="#0284C7" font-family="sans-serif" font-size="9" font-weight="600">Auto-renew 96%</text>

