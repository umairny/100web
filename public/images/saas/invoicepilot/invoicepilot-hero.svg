<svg width="1080" height="640" viewBox="0 0 1080 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="heroShadow" x="-20" y="-10" width="1120" height="680" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="60%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>

    <linearGradient id="planeGrad" x1="60" y1="200" x2="280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <linearGradient id="dashboardBg" x1="500" y1="180" x2="1040" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="emeraldBar" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="blueBar" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1080" height="640" rx="20" fill="url(#skyGrad)" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- City Skyline Illustration (Background layer) -->
  <g opacity="0.85">
    <!-- Skyscraper 1 -->
    <rect x="180" y="320" width="46" height="240" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
    <line x1="195" y1="340" x2="195" y2="550" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="210" y1="340" x2="210" y2="550" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8" />

    <!-- Skyscraper 2 -->
    <rect x="235" y="270" width="58" height="290" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="250" y1="290" x2="250" y2="550" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="270" y1="290" x2="270" y2="550" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8" />

    <!-- Skyscraper 3 -->
    <rect x="300" y="310" width="52" height="250" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
    <line x1="316" y1="330" x2="316" y2="550" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="336" y1="330" x2="336" y2="550" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8" />

    <!-- Skyscraper 4 (Tall Spire) -->
    <rect x="360" y="220" width="68" height="340" fill="#94A3B8" stroke="#64748B" stroke-width="1.5" />
    <polygon points="394,180 388,220 400,220" fill="#64748B" />
    <line x1="394" y1="165" x2="394" y2="180" stroke="#0F172A" stroke-width="2" />
    <circle cx="394" cy="165" r="2.5" fill="#EF4444" />
    <line x1="380" y1="240" x2="380" y2="550" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 6" />
    <line x1="408" y1="240" x2="408" y2="550" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 6" />

    <!-- Skyscraper 5 -->
    <rect x="435" y="300" width="50" height="260" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="452" y1="320" x2="452" y2="550" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8" />
    <line x1="468" y1="320" x2="468" y2="550" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8" />

    <!-- Cloud in sky -->
    <path d="M380 140C380 128 390 118 402 118C405 118 408 119 411 120C417 110 427 104 440 104C458 104 472 118 472 135C479 135 486 142 486 150C486 158 479 164 472 164H388C378 164 370 156 370 146C370 143 371 140 373 138" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Green Trees at base -->
    <circle cx="160" cy="550" r="16" fill="#34D399" />
    <circle cx="180" cy="554" r="14" fill="#10B981" />
    <circle cx="495" cy="550" r="18" fill="#10B981" />
    <circle cx="515" cy="554" r="14" fill="#059669" />
