    <text x="668" y="302" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="600">Acme SaaS Corp</text>
    <text x="668" y="313" fill="#64748B" font-family="sans-serif" font-size="8">INV-2048 • $2,400</text>
    <rect x="784" y="294" width="44" height="16" rx="4" fill="#DCFCE7" />
    <text x="792" y="305" fill="#166534" font-family="sans-serif" font-size="8" font-weight="700">PAID</text>

    <!-- Invoice Row 2 -->
    <line x1="668" y1="324" x2="828" y2="324" stroke="#F1F5F9" stroke-width="1" />
    <text x="668" y="340" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="600">Starlight AI Inc</text>
    <text x="668" y="351" fill="#64748B" font-family="sans-serif" font-size="8">INV-2049 • $1,250</text>
    <rect x="784" y="332" width="44" height="16" rx="4" fill="#DCFCE7" />
    <text x="792" y="343" fill="#166534" font-family="sans-serif" font-size="8" font-weight="700">PAID</text>

    <!-- Invoice Row 3 -->
    <line x1="668" y1="362" x2="828" y2="362" stroke="#F1F5F9" stroke-width="1" />
    <text x="668" y="378" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="600">Apex Retail Labs</text>
    <text x="668" y="389" fill="#64748B" font-family="sans-serif" font-size="8">INV-2050 • $4,890</text>
    <rect x="774" y="370" width="54" height="16" rx="4" fill="#FEF3C7" />
    <text x="780" y="381" fill="#D97706" font-family="sans-serif" font-size="8" font-weight="700">PENDING</text>

    <!-- Dunning & Recovery Bottom Banner inside Dashboard -->
    <rect x="656" y="420" width="368" height="74" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <circle cx="678" cy="457" r="12" fill="#0284C7" />
    <path d="M674 457L677 460L683 454" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
    <text x="698" y="450" fill="#0369A1" font-family="sans-serif" font-size="11" font-weight="700">Automated Smart Dunning Active</text>
    <text x="698" y="468" fill="#0284C7" font-family="sans-serif" font-size="9">Recovered $14,820 this month via intelligent retry cadences (94.2% recovery rate).</text>

    <!-- Bottom sync ticker -->
    <rect x="656" y="504" width="368" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="674" cy="525" r="4" fill="#10B981" />
    <text x="686" y="528" fill="#475569" font-family="sans-serif" font-size="10" font-weight="600">Synced with Stripe &amp; QuickBooks • 2 seconds ago</text>
