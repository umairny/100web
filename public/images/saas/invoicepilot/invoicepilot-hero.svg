    <line x1="30" y1="50" x2="50" y2="100" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="50" x2="30" y2="105" stroke="#334155" stroke-width="3" stroke-linecap="round" />

    <!-- Outer rings -->
