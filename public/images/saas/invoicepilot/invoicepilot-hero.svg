    <rect x="886" y="320" width="12" height="70" rx="3" fill="#38BDF8" />
    <rect x="906" y="310" width="12" height="80" rx="3" fill="#0284C7" />
    <rect x="926" y="295" width="12" height="95" rx="3" fill="#0284C7" />
    <rect x="946" y="290" width="12" height="100" rx="3" fill="#059669" />
    <rect x="966" y="280" width="12" height="110" rx="3" fill="#10B981" />
    <rect x="986" y="270" width="12" height="120" rx="3" fill="#10B981" />

