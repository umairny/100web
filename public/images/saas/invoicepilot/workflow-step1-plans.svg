<svg width="340" height="240" viewBox="0 0 340 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="planCardGlow" x="-10" y="-10" width="360" height="260" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.08" />
    </filter>
  </defs>

  <g filter="url(#planCardGlow)">
    <rect x="15" y="15" width="310" height="210" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Top Window Title -->
    <rect x="15" y="15" width="310" height="32" rx="12" fill="#0284C7" />
    <circle cx="32" cy="31" r="3" fill="#BAE6FD" />
    <circle cx="44" cy="31" r="3" fill="#BAE6FD" />
    <circle cx="56" cy="31" r="3" fill="#BAE6FD" />
    <text x="75" y="35" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">Product / Plan Builder</text>

    <!-- Plan 1 Mini Card -->
    <rect x="30" y="60" width="76" height="110" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <rect x="40" y="70" width="28" height="6" rx="3" fill="#94A3B8" />
    <text x="40" y="94" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="800">$29</text>
    <rect x="40" y="104" width="56" height="3" rx="1.5" fill="#CBD5E1" />
    <rect x="40" y="112" width="46" height="3" rx="1.5" fill="#CBD5E1" />
    <rect x="40" y="120" width="50" height="3" rx="1.5" fill="#CBD5E1" />
    <rect x="40" y="142" width="56" height="18" rx="4" fill="#E2E8F0" />
    <text x="50" y="154" fill="#64748B" font-family="sans-serif" font-size="8" font-weight="700">Select</text>

    <!-- Plan 2 Mini Card (Active / Selected) -->
    <rect x="116" y="55" width="84" height="120" rx="8" fill="#EFF6FF" stroke="#0284C7" stroke-width="1.5" />
    <rect x="124" y="66" width="36" height="6" rx="3" fill="#0284C7" />
    <text x="124" y="92" fill="#0284C7" font-family="sans-serif" font-size="14" font-weight="800">$99</text>
    <text x="156" y="92" fill="#64748B" font-family="sans-serif" font-size="8">/ mo</text>
    <rect x="124" y="104" width="68" height="3" rx="1.5" fill="#93C5FD" />
    <rect x="124" y="112" width="54" height="3" rx="1.5" fill="#93C5FD" />
    <rect x="124" y="120" width="60" height="3" rx="1.5" fill="#93C5FD" />
    <rect x="124" y="146" width="68" height="20" rx="4" fill="#0284C7" />
    <text x="136" y="159" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="700">Active</text>

    <!-- Plan 3 Mini Card -->
    <rect x="210" y="60" width="76" height="110" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <rect x="220" y="70" width="32" height="6" rx="3" fill="#94A3B8" />
    <text x="220" y="94" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="800">$249</text>
    <rect x="220" y="104" width="56" height="3" rx="1.5" fill="#CBD5E1" />
    <rect x="220" y="112" width="46" height="3" rx="1.5" fill="#CBD5E1" />
    <rect x="220" y="120" width="50" height="3" rx="1.5" fill="#CBD5E1" />
    <rect x="220" y="142" width="56" height="18" rx="4" fill="#E2E8F0" />
    <text x="230" y="154" fill="#64748B" font-family="sans-serif" font-size="8" font-weight="700">Select</text>

    <!-- Cycle Tag at bottom -->
    <rect x="80" y="190" width="160" height="22" rx="11" fill="#DCFCE7" />
    <text x="100" y="205" fill="#166534" font-family="sans-serif" font-size="9" font-weight="700">Cycle: Monthly or Annual</text>
  </g>
</svg>
