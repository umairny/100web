<svg width="340" height="240" viewBox="0 0 340 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="onboardGlow" x="-10" y="-10" width="360" height="260" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.08" />
    </filter>
  </defs>

  <g filter="url(#onboardGlow)">
    <rect x="15" y="15" width="310" height="210" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Top Window Title -->
    <rect x="15" y="15" width="310" height="32" rx="12" fill="#0F172A" />
    <circle cx="32" cy="31" r="3" fill="#64748B" />
    <circle cx="44" cy="31" r="3" fill="#64748B" />
    <circle cx="56" cy="31" r="3" fill="#64748B" />
    <text x="75" y="35" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">Client Self-Serve Portal</text>

    <!-- Form Mockup -->
    <text x="35" y="72" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="700">Customer Onboarding</text>
    
    <!-- Input 1: Company / Name -->
    <rect x="35" y="82" width="180" height="24" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="44" y="98" fill="#475569" font-family="sans-serif" font-size="9">Acme Global Holdings</text>

    <!-- Input 2: Work Email -->
    <rect x="35" y="114" width="180" height="24" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="44" y="130" fill="#94A3B8" font-family="sans-serif" font-size="9">billing@acmeglobal.com</text>

    <!-- Input 3: Payment Method -->
    <rect x="35" y="146" width="180" height="24" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
    <circle cx="46" cy="158" r="5" fill="#0284C7" />
    <text x="58" y="162" fill="#0369A1" font-family="sans-serif" font-size="9" font-weight="600">•••• 4242 (Stripe Verified)</text>

    <!-- Action Button -->
    <rect x="35" y="180" width="180" height="28" rx="6" fill="#10B981" />
    <text x="80" y="198" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700">Confirm &amp; Subscribe</text>

    <!-- Avatars & Team Connection on Right -->
    <g transform="translate(230, 80)">
      <circle cx="35" cy="25" r="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" />
      <text x="27" y="29" fill="#1E40AF" font-family="sans-serif" font-size="10" font-weight="700">CEO</text>

      <circle cx="20" cy="65" r="14" fill="#DCFCE7" stroke="#10B981" stroke-width="1.5" />
      <text x="14" y="69" fill="#166534" font-family="sans-serif" font-size="9" font-weight="700">CFO</text>

      <circle cx="50" cy="65" r="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" />
      <text x="44" y="69" fill="#78350F" font-family="sans-serif" font-size="9" font-weight="700">OPS</text>

      <!-- Connecting line to form -->
      <path d="M-15 48 C 0 48, 5 35, 20 35" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3" fill="none" />
      
      <rect x="0" y="95" width="70" height="18" rx="9" fill="#DCFCE7" />
      <text x="10" y="107" fill="#166534" font-family="sans-serif" font-size="8" font-weight="700">✓ Auto-Invited</text>
    </g>
  </g>
</svg>
