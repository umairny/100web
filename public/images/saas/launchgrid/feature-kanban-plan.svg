<svg width="440" height="280" viewBox="0 0 440 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardGlow" x="-10" y="-10" width="460" height="300" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <g filter="url(#cardGlow)">
    <rect x="15" y="15" width="410" height="250" rx="14" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Window top bar -->
    <rect x="15" y="15" width="410" height="36" rx="14" fill="#F8FAFC" />
    <circle cx="34" cy="33" r="4" fill="#EF4444" />
    <circle cx="48" cy="33" r="4" fill="#F59E0B" />
    <circle cx="62" cy="33" r="4" fill="#10B981" />
    <text x="80" y="37" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Visualize Your Vision</text>

    <!-- Column 1: Backlog -->
    <rect x="28" y="60" width="116" height="190" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="38" y="78" fill="#1E293B" font-family="sans-serif" font-size="10" font-weight="700">Roadmap</text>
    
    <rect x="34" y="88" width="104" height="42" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <rect x="42" y="96" width="34" height="6" rx="3" fill="#3B82F6" />
    <rect x="42" y="108" width="70" height="4" rx="2" fill="#94A3B8" />
    <circle cx="124" cy="116" r="6" fill="#60A5FA" />

    <rect x="34" y="136" width="104" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <rect x="42" y="144" width="42" height="6" rx="3" fill="#10B981" />
    <rect x="42" y="156" width="56" height="4" rx="2" fill="#94A3B8" />
    <circle cx="124" cy="164" r="6" fill="#34D399" />

    <!-- Column 2: In Progress -->
    <rect x="156" y="60" width="116" height="190" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
    <text x="166" y="78" fill="#1D4ED8" font-family="sans-serif" font-size="10" font-weight="700">In Progress</text>

    <!-- Active Moved Card -->
    <rect x="162" y="88" width="104" height="54" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
    <rect x="170" y="96" width="46" height="6" rx="3" fill="#2563EB" />
    <rect x="170" y="108" width="84" height="4" rx="2" fill="#64748B" />
    <rect x="170" y="118" width="56" height="4" rx="2" fill="#94A3B8" />
    <circle cx="250" cy="128" r="6" fill="#F472B6" />

    <rect x="162" y="148" width="104" height="42" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <rect x="170" y="156" width="38" height="6" rx="3" fill="#F59E0B" />
    <rect x="170" y="168" width="60" height="4" rx="2" fill="#94A3B8" />
    <circle cx="250" cy="176" r="6" fill="#FBBF24" />

    <!-- Column 3: Done -->
    <rect x="284" y="60" width="128" height="190" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="294" y="78" fill="#166534" font-family="sans-serif" font-size="10" font-weight="700">Completed (18)</text>

    <rect x="290" y="88" width="116" height="42" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1" />
    <rect x="298" y="96" width="50" height="6" rx="3" fill="#16A34A" />
    <path d="M388 108L392 112L400 104" stroke="#16A34A" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Visual Arrow connecting Roadmapped card to In-Progress card -->
    <path d="M138 109C148 109 150 115 160 115" stroke="#2563EB" stroke-width="2" stroke-dasharray="3 3" fill="none" />
    <polygon points="160,112 166,115 160,118" fill="#2563EB" />
  </g>
</svg>
