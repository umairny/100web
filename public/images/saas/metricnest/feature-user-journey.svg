<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="100%" fill="none">
  <rect width="360" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="0" y="0" width="360" height="36" rx="12" fill="#F8FAFC"/>
  <rect x="0" y="24" width="360" height="12" fill="#F8FAFC"/>
  <circle cx="16" cy="18" r="3.5" fill="#EF4444"/>
  <circle cx="28" cy="18" r="3.5" fill="#F59E0B"/>
  <circle cx="40" cy="18" r="3.5" fill="#10B981"/>
  <text x="60" y="22" font-family="sans-serif" font-size="9" fill="#64748B" font-weight="600">User Journey Flow · Multi-Touch Sessions</text>

  <!-- Flow Steps -->
  <g transform="translate(20, 56)">
    <!-- Stage 1 -->
    <rect x="0" y="20" width="60" height="70" rx="6" fill="#F0F9FF" stroke="#BAE6FD"/>
    <text x="10" y="42" font-family="sans-serif" font-size="8.5" fill="#0369A1" font-weight="bold">Landing</text>
    <text x="10" y="56" font-family="sans-serif" font-size="11" fill="#0F172A" font-weight="900">100%</text>
    <text x="10" y="70" font-family="sans-serif" font-size="7" fill="#64748B">34,120 hits</text>

    <!-- Connector 1 -->
    <path d="M60 55 C 90 55, 90 40, 120 40" stroke="#0284C7" stroke-width="3" fill="none"/>
    <path d="M60 65 C 90 65, 90 95, 120 95" stroke="#F43F5E" stroke-width="2" stroke-dasharray="3 3" fill="none"/>

    <!-- Stage 2 -->
    <rect x="120" y="10" width="65" height="70" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="130" y="32" font-family="sans-serif" font-size="8.5" fill="#065F46" font-weight="bold">Sign Up</text>
    <text x="130" y="46" font-family="sans-serif" font-size="11" fill="#0F172A" font-weight="900">68.4%</text>
    <text x="130" y="60" font-family="sans-serif" font-size="7" fill="#059669">+12% SEO</text>

    <!-- Drop off stage -->
    <rect x="120" y="90" width="65" height="30" rx="4" fill="#FFF1F2" stroke="#FECDD3"/>
    <text x="128" y="108" font-family="sans-serif" font-size="7.5" fill="#E11D48" font-weight="bold">Bounce: 31.6%</text>

    <!-- Connector 2 -->
    <path d="M185 45 C 215 45, 215 45, 245 45" stroke="#10B981" stroke-width="3" fill="none"/>

    <!-- Stage 3 -->
    <rect x="245" y="10" width="70" height="70" rx="6" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="255" y="32" font-family="sans-serif" font-size="8.5" fill="#0F766E" font-weight="bold">Activated</text>
    <text x="255" y="46" font-family="sans-serif" font-size="11" fill="#0F172A" font-weight="900">48.2%</text>
    <text x="255" y="60" font-family="sans-serif" font-size="7" fill="#0D9488">16.4k users</text>
  </g>

  <rect x="20" y="180" width="320" height="24" rx="4" fill="#F8FAFC"/>
  <text x="28" y="196" font-family="sans-serif" font-size="8" fill="#475569" font-weight="600">MetricNest auto-clusters identical drop-off intent patterns</text>
</svg>
