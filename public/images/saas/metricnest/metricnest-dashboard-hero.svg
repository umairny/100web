      <text x="250" y="10" font-family="sans-serif" font-size="8" fill="#64748B" font-weight="bold">W5</text>
      <text x="285" y="10" font-family="sans-serif" font-size="8" fill="#64748B" font-weight="bold">W6</text>

      <!-- Row 1: Oct Cohort -->
