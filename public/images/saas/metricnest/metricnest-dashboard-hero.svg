      <!-- Baseline Variant A curve -->
      <path d="M0 65 C 40 60, 80 55, 120 52 C 160 50, 200 48, 255 45" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3 3"/>
      <!-- Variant B curve (Outperforming) -->
      <path d="M0 65 C 40 50, 80 35, 120 25 C 160 18, 200 12, 255 8" stroke="#10B981" stroke-width="2.5"/>

      <!-- Legend -->
