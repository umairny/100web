<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%" fill="none">
  <defs>
    <filter id="dashShadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="metricGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="metricGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="sankey1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sankey2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Dashboard Window Outer Container -->
  <rect x="10" y="10" width="880" height="580" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#dashShadow)"/>

  <!-- Left Sidebar (Midnight Navy) -->
  <rect x="10" y="10" width="180" height="580" rx="16" fill="#0B132B"/>
  <rect x="170" y="10" width="20" height="580" fill="#0B132B"/>
  
  <!-- Sidebar Brand -->
  <g transform="translate(28, 30)">
    <!-- Bird Nest Icon -->
    <path d="M0 16C4 22 14 26 24 24C28 23 32 20 34 16C26 19 14 19 4 16Z" fill="#10B981"/>
    <path d="M4 14C10 8 18 4 28 4C24 9 18 13 8 14Z" fill="#06B6D4"/>
    <rect x="8" y="7" width="3" height="10" rx="1.5" fill="#10B981"/>
    <rect x="14" y="4" width="3" height="13" rx="1.5" fill="#06B6D4"/>
    <rect x="20" y="9" width="3" height="8" rx="1.5" fill="#3B82F6"/>
    <text x="42" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="900" letter-spacing="-0.02em">MetricNest</text>
    <text x="42" y="27" font-family="sans-serif" font-size="8" fill="#10B981" font-weight="700" letter-spacing="0.1em">ANALYTICS</text>
  </g>

  <!-- Sidebar Nav Menu Items -->
  <g transform="translate(24, 85)">
