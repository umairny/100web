    <rect width="285" height="160" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="14" y="20" font-family="sans-serif" font-size="11.5" fill="#0F172A" font-weight="800">A/B Testing Insights</text>
    <rect x="195" y="8" width="76" height="18" rx="4" fill="#ECFDF5"/>
    <text x="201" y="20" font-family="sans-serif" font-size="8" fill="#059669" font-weight="bold">99.4% Conf.</text>

    <!-- Mini chart comparison curves -->
