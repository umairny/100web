    <rect x="0" y="0" width="150" height="34" rx="8" fill="#10B981" fill-opacity="0.15"/>
    <circle cx="16" cy="17" r="5" fill="#10B981"/>
    <text x="32" y="21" font-family="sans-serif" font-size="11.5" fill="#10B981" font-weight="700">Dashboard</text>

    <!-- Nav Items -->
    <g transform="translate(0, 42)">
      <circle cx="16" cy="17" r="4" fill="#64748B"/>
      <text x="32" y="21" font-family="sans-serif" font-size="11.5" fill="#94A3B8" font-weight="500">User Journeys</text>
    </g>
    <g transform="translate(0, 76)">
      <circle cx="16" cy="17" r="4" fill="#64748B"/>
      <text x="32" y="21" font-family="sans-serif" font-size="11.5" fill="#94A3B8" font-weight="500">Funnels &amp; Paths</text>
    </g>
    <g transform="translate(0, 110)">
      <circle cx="16" cy="17" r="4" fill="#64748B"/>
      <text x="32" y="21" font-family="sans-serif" font-size="11.5" fill="#94A3B8" font-weight="500">Retention Cohorts</text>
    </g>
    <g transform="translate(0, 144)">
      <circle cx="16" cy="17" r="4" fill="#64748B"/>
      <text x="32" y="21" font-family="sans-serif" font-size="11.5" fill="#94A3B8" font-weight="500">A/B Testing</text>
    </g>
    <g transform="translate(0, 178)">
      <circle cx="16" cy="17" r="4" fill="#64748B"/>
      <text x="32" y="21" font-family="sans-serif" font-size="11.5" fill="#94A3B8" font-weight="500">Audience Segments</text>
    </g>
    <g transform="translate(0, 212)">
