    <circle cx="18" cy="21" r="4" fill="#10B981"/>
    <text x="30" y="18" font-family="sans-serif" font-size="9" fill="#F8FAFC" font-weight="700">Live Ingesting</text>
    <text x="30" y="29" font-family="sans-serif" font-size="8" fill="#94A3B8">3,842 events/sec</text>
  </g>

  <!-- Main Content Area -->
  <!-- Top App Navigation / Search -->
  <g transform="translate(210, 24)">
    <text x="0" y="22" font-family="sans-serif" font-size="18" fill="#0F172A" font-weight="800">Product Analytics Overview</text>
    <text x="0" y="38" font-family="sans-serif" font-size="11" fill="#64748B">Real-time session insights and multi-step conversion funnel</text>

    <!-- Date Range Picker & Export buttons -->
    <g transform="translate(480, 8)">
      <rect width="90" height="30" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="14" y="19" font-family="sans-serif" font-size="10" fill="#475569" font-weight="600">Last 30 Days ▾</text>
      <rect x="98" y="0" width="80" height="30" rx="6" fill="#10B981"/>
      <text x="114" y="19" font-family="sans-serif" font-size="10.5" fill="#FFFFFF" font-weight="700">+ New Query</text>
    </g>
  </g>

  <!-- 4 Top KPI Cards -->
  <g transform="translate(210, 80)">
    <!-- KPI 1: Active Users -->
    <rect x="0" y="0" width="155" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="14" y="20" font-family="sans-serif" font-size="9.5" fill="#64748B" font-weight="600">MONTHLY ACTIVE USERS</text>
    <text x="14" y="46" font-family="sans-serif" font-size="20" fill="#0F172A" font-weight="900">48,520</text>
    <rect x="14" y="52" width="60" height="14" rx="3" fill="#ECFDF5"/>
    <text x="18" y="62" font-family="sans-serif" font-size="8.5" fill="#059669" font-weight="700">▲ +14.2%</text>

    <!-- KPI 2: Funnel Conversion -->
    <rect x="170" y="0" width="155" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="184" y="20" font-family="sans-serif" font-size="9.5" fill="#64748B" font-weight="600">OVERALL CONVERSION</text>
    <text x="184" y="46" font-family="sans-serif" font-size="20" fill="#0F172A" font-weight="900">4.82%</text>
    <rect x="184" y="52" width="55" height="14" rx="3" fill="#ECFDF5"/>
    <text x="188" y="62" font-family="sans-serif" font-size="8.5" fill="#059669" font-weight="700">▲ +0.6%</text>

    <!-- KPI 3: Churn Rate -->
