    <text x="354" y="20" font-family="sans-serif" font-size="9.5" fill="#64748B" font-weight="600">30-DAY CHURN</text>
    <text x="354" y="46" font-family="sans-serif" font-size="20" fill="#0F172A" font-weight="900">1.24%</text>
    <rect x="354" y="52" width="58" height="14" rx="3" fill="#ECFDF5"/>
    <text x="358" y="62" font-family="sans-serif" font-size="8.5" fill="#059669" font-weight="700">▼ -0.3% low</text>

    <!-- KPI 4: Avg Session Duration -->
    <rect x="510" y="0" width="155" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="524" y="20" font-family="sans-serif" font-size="9.5" fill="#64748B" font-weight="600">AVG ENGAGEMENT</text>
    <text x="524" y="46" font-family="sans-serif" font-size="20" fill="#0F172A" font-weight="900">8m 42s</text>
    <rect x="524" y="52" width="58" height="14" rx="3" fill="#ECFDF5"/>
    <text x="528" y="62" font-family="sans-serif" font-size="8.5" fill="#059669" font-weight="700">▲ +1m 10s</text>
