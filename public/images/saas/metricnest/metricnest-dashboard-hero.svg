      <text x="65" y="30" font-family="sans-serif" font-size="8" fill="#64748B">8,420</text>
      <rect x="105" y="18" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.9"/><text x="112" y="30" font-family="sans-serif" font-size="7.5" fill="#FFF" font-weight="bold">84%</text>
      <rect x="140" y="18" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.75"/><text x="147" y="30" font-family="sans-serif" font-size="7.5" fill="#FFF" font-weight="bold">69%</text>
      <rect x="175" y="18" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.6"/><text x="182" y="30" font-family="sans-serif" font-size="7.5" fill="#FFF" font-weight="bold">58%</text>
      <rect x="210" y="18" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.5"/><text x="217" y="30" font-family="sans-serif" font-size="7.5" fill="#FFF" font-weight="bold">51%</text>
      <rect x="245" y="18" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.45"/><text x="252" y="30" font-family="sans-serif" font-size="7.5" fill="#1E293B" font-weight="bold">46%</text>
      <rect x="280" y="18" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.4"/><text x="287" y="30" font-family="sans-serif" font-size="7.5" fill="#1E293B" font-weight="bold">44%</text>

      <!-- Row 2: Oct Cohort 2 -->
      <text x="0" y="56" font-family="sans-serif" font-size="8" fill="#1E293B" font-weight="600">Oct 08</text>
      <text x="65" y="56" font-family="sans-serif" font-size="8" fill="#64748B">9,110</text>
      <rect x="105" y="44" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.95"/><text x="112" y="56" font-family="sans-serif" font-size="7.5" fill="#FFF" font-weight="bold">88%</text>
      <rect x="140" y="44" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.8"/><text x="147" y="56" font-family="sans-serif" font-size="7.5" fill="#FFF" font-weight="bold">72%</text>
      <rect x="175" y="44" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.65"/><text x="182" y="56" font-family="sans-serif" font-size="7.5" fill="#FFF" font-weight="bold">61%</text>
      <rect x="210" y="44" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.55"/><text x="217" y="56" font-family="sans-serif" font-size="7.5" fill="#FFF" font-weight="bold">54%</text>
      <rect x="245" y="44" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.5"/><text x="252" y="56" font-family="sans-serif" font-size="7.5" fill="#FFF" font-weight="bold">49%</text>
      <rect x="280" y="44" width="30" height="18" rx="3" fill="#E2E8F0"/><text x="290" y="56" font-family="sans-serif" font-size="7.5" fill="#94A3B8">—</text>

      <!-- Row 3: Oct Cohort 3 -->
      <text x="0" y="82" font-family="sans-serif" font-size="8" fill="#1E293B" font-weight="600">Oct 15</text>
      <text x="65" y="82" font-family="sans-serif" font-size="8" fill="#64748B">10,450</text>
      <rect x="105" y="70" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.98"/><text x="112" y="82" font-family="sans-serif" font-size="7.5" fill="#FFF" font-weight="bold">92%</text>
      <rect x="140" y="70" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.85"/><text x="147" y="82" font-family="sans-serif" font-size="7.5" fill="#FFF" font-weight="bold">78%</text>
      <rect x="175" y="70" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.7"/><text x="182" y="82" font-family="sans-serif" font-size="7.5" fill="#FFF" font-weight="bold">65%</text>
      <rect x="210" y="70" width="30" height="18" rx="3" fill="#10B981" fill-opacity="0.6"/><text x="217" y="82" font-family="sans-serif" font-size="7.5" fill="#FFF" font-weight="bold">59%</text>
      <rect x="245" y="70" width="30" height="18" rx="3" fill="#E2E8F0"/><text x="255" y="82" font-family="sans-serif" font-size="7.5" fill="#94A3B8">—</text>
      <rect x="280" y="70" width="30" height="18" rx="3" fill="#E2E8F0"/><text x="290" y="82" font-family="sans-serif" font-size="7.5" fill="#94A3B8">—</text>
