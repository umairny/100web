      <text x="20" y="88" font-family="sans-serif" font-size="8.5" fill="#0F172A" font-weight="bold">Variant B (+24.8% Lift)</text>
      <circle cx="140" cy="85" r="4" fill="#94A3B8"/>
      <text x="150" y="88" font-family="sans-serif" font-size="8.5" fill="#64748B">Variant A (Control)</text>
