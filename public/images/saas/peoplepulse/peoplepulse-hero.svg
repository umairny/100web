<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Ambient Backdrop Gradients -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#F5F3FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="dashShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <filter id="pillShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>

    <linearGradient id="chartBar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="chartBar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="chartBar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="chartBar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="440" cy="240" rx="380" ry="200" fill="url(#heroGlow)" />

  <!-- ============================================================ -->
  <!-- CENTRAL DASHBOARD MOCKUP (Width: 540, Height: 350)           -->
  <!-- ============================================================ -->
  <g transform="translate(170, 65)" filter="url(#dashShadow)">
    <!-- Dashboard Outer Window -->
    <rect x="0" y="0" width="540" height="350" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Top Window Chrome / Header -->
    <rect x="0" y="0" width="540" height="36" rx="16" fill="#FFFFFF" />
    <rect x="0" y="20" width="540" height="16" fill="#FFFFFF" />
    <line x1="0" y1="36" x2="540" y2="36" stroke="#F1F5F9" stroke-width="1" />

    <!-- Search Input in Header -->
    <rect x="150" y="8" width="180" height="20" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="162" cy="18" r="3.5" stroke="#94A3B8" stroke-width="1" fill="none" />
    <line x1="164.5" y1="20.5" x2="168" y2="24" stroke="#94A3B8" stroke-width="1" />
    <text x="174" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Search employees, docs...</text>

    <!-- Header User Avatar -->
    <circle cx="510" cy="18" r="9" fill="#0D9488" />
    <text x="510" y="21" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">HR</text>

    <!-- ==================== LEFT DASHBOARD SIDEBAR ==================== -->
    <g>
      <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 130 0 L 130 350 L 16 350 C 7.16 350 0 342.84 0 334 Z" fill="#0F172A" />

      <!-- Sidebar Brand Logo -->
      <g transform="translate(16, 14)">
        <circle cx="6" cy="6" r="5" fill="#14B8A6" />
        <circle cx="14" cy="6" r="4" fill="#38BDF8" />
        <text x="24" y="10" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">PeoplePulse</text>
      </g>

      <!-- Sidebar Navigation Items -->
      <g transform="translate(12, 48)">
        <!-- Active Dashboard -->
        <rect x="0" y="0" width="106" height="24" rx="6" fill="#1E293B" />
        <circle cx="10" cy="12" r="3" fill="#14B8A6" />
        <text x="20" y="15" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Dashboard</text>

        <!-- Nav 2 -->
        <g transform="translate(0, 30)">
          <circle cx="10" cy="8" r="2.5" fill="#64748B" />
          <text x="20" y="11" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Employees</text>
        </g>
        <!-- Nav 3 -->
        <g transform="translate(0, 52)">
          <circle cx="10" cy="8" r="2.5" fill="#64748B" />
          <text x="20" y="11" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Time Off</text>
        </g>
        <!-- Nav 4 -->
        <g transform="translate(0, 74)">
          <circle cx="10" cy="8" r="2.5" fill="#64748B" />
          <text x="20" y="11" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Performance</text>
        </g>
        <!-- Nav 5 -->
        <g transform="translate(0, 96)">
          <circle cx="10" cy="8" r="2.5" fill="#64748B" />
          <text x="20" y="11" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Payroll</text>
        </g>
        <!-- Nav 6 -->
        <g transform="translate(0, 118)">
          <circle cx="10" cy="8" r="2.5" fill="#64748B" />
          <text x="20" y="11" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Settings</text>
        </g>
      </g>
    </g>

    <!-- ==================== DASHBOARD CONTENT PANEL ==================== -->
    <g transform="translate(142, 48)">
      <!-- Row 1: Profile card + Headcount widget + Analytics widget -->
      <!-- Profile Card -->
      <g>
        <rect x="0" y="0" width="118" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="59" cy="32" r="16" fill="#FDE68A" />
        <!-- Avatar inner -->
        <circle cx="59" cy="30" r="8" fill="#B45309" />
        <path d="M 47 46 C 47 40 52 38 59 38 C 66 38 71 40 71 46 Z" fill="#B45309" />
        <text x="59" y="60" fill="#0F172A" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Elena Woods</text>
        <text x="59" y="70" fill="#64748B" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">VP of Operations</text>
        <rect x="24" y="76" width="70" height="12" rx="6" fill="#DCFCE7" />
        <text x="59" y="85" fill="#15803D" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Active • On Track</text>
      </g>

      <!-- Headcount Stat Widget -->
      <g transform="translate(126, 0)">
        <rect x="0" y="0" width="124" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="18" fill="#64748B" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-transform="uppercase">Total Headcount</text>
        <text x="12" y="44" fill="#0F172A" font-family="system-ui, sans-serif" font-size="20" font-weight="900">1,250</text>
        <text x="12" y="58" fill="#16A34A" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">+12% this quarter</text>
        <!-- Mini sparkline -->
        <path d="M 12 80 L 35 76 L 60 78 L 85 70 L 110 66" stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round" />
      </g>

      <!-- Analytics Chart Widget -->
      <g transform="translate(258, 0)">
        <rect x="0" y="0" width="128" height="96" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="12" y="18" fill="#64748B" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">Workforce Analytics</text>
        <!-- Bar chart -->
        <g transform="translate(16, 28)">
          <rect x="0" y="24" width="14" height="34" rx="3" fill="url(#chartBar1)" />
          <rect x="22" y="14" width="14" height="44" rx="3" fill="url(#chartBar2)" />
          <rect x="44" y="8" width="14" height="50" rx="3" fill="url(#chartBar3)" />
          <rect x="66" y="20" width="14" height="38" rx="3" fill="url(#chartBar4)" />
          <rect x="88" y="2" width="14" height="56" rx="3" fill="url(#chartBar1)" />
        </g>
      </g>

      <!-- Row 2: Recent Activity + Task Management -->
      <!-- Recent Activity -->
      <g transform="translate(0, 106)">
        <rect x="0" y="0" width="186" height="180" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="14" y="20" fill="#0F172A" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Recent HR Activity</text>

        <!-- Item 1 -->
        <g transform="translate(14, 34)">
          <circle cx="10" cy="10" r="10" fill="#EFF6FF" />
          <text x="10" y="13" fill="#2563EB" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">★</text>
          <text x="26" y="10" fill="#1E293B" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">Promotion approved</text>
          <text x="26" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="7">Marcus Vance • Eng Lead</text>
        </g>

        <!-- Item 2 -->
        <g transform="translate(14, 68)">
          <circle cx="10" cy="10" r="10" fill="#ECFDF5" />
          <text x="10" y="13" fill="#059669" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">✓</text>
          <text x="26" y="10" fill="#1E293B" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">Onboarding Day 1</text>
          <text x="26" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="7">Sarah Jenkins • Product</text>
        </g>

        <!-- Item 3 -->
        <g transform="translate(14, 102)">
          <circle cx="10" cy="10" r="10" fill="#FDF4FF" />
          <text x="10" y="13" fill="#A855F7" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">✈</text>
          <text x="26" y="10" fill="#1E293B" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">PTO Request (4 days)</text>
          <text x="26" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="7">David K. • Auto-Approved</text>
        </g>

        <!-- Item 4 -->
        <g transform="translate(14, 136)">
          <circle cx="10" cy="10" r="10" fill="#FFFBEB" />
          <text x="10" y="13" fill="#D97706" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">📄</text>
          <text x="26" y="10" fill="#1E293B" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">Offer letter signed</text>
          <text x="26" y="18" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="7">Alex Chen • Sr Designer</text>
        </g>
      </g>

      <!-- Task Management Checklist -->
      <g transform="translate(196, 106)">
        <rect x="0" y="0" width="190" height="180" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="14" y="20" fill="#0F172A" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Action Required (4)</text>

        <!-- Task 1 -->
        <g transform="translate(14, 34)">
          <rect x="0" y="0" width="162" height="30" rx="6" fill="#F8FAFC" />
          <circle cx="12" cy="15" r="5" fill="#10B981" />
          <text x="24" y="15" fill="#0F172A" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">Q1 Review Cycle Launch</text>
          <text x="24" y="23" fill="#64748B" font-family="system-ui, sans-serif" font-size="7">Due today • 100% ready</text>
        </g>

        <!-- Task 2 -->
        <g transform="translate(14, 70)">
          <rect x="0" y="0" width="162" height="30" rx="6" fill="#F8FAFC" />
          <circle cx="12" cy="15" r="5" fill="#2563EB" />
          <text x="24" y="15" fill="#0F172A" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">Health Benefit Enrollment</text>
          <text x="24" y="23" fill="#64748B" font-family="system-ui, sans-serif" font-size="7">142 submissions pending</text>
        </g>

        <!-- Task 3 -->
        <g transform="translate(14, 106)">
          <rect x="0" y="0" width="162" height="30" rx="6" fill="#F8FAFC" />
          <circle cx="12" cy="15" r="5" fill="#F59E0B" />
          <text x="24" y="15" fill="#0F172A" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">Hardware Provisioning</text>
          <text x="24" y="23" fill="#64748B" font-family="system-ui, sans-serif" font-size="7">MacBook M3 order placed</text>
        </g>

        <!-- Task 4 -->
        <g transform="translate(14, 142)">
          <rect x="0" y="0" width="162" height="30" rx="6" fill="#F8FAFC" />
          <circle cx="12" cy="15" r="5" fill="#8B5CF6" />
          <text x="24" y="15" fill="#0F172A" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">Compliance Certification</text>
          <text x="24" y="23" fill="#64748B" font-family="system-ui, sans-serif" font-size="7">SOC 2 staff sign-off 98%</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- LEFT CHARACTER: HR SPECIALIST (Woman with folder & glasses)  -->
  <!-- ============================================================ -->
  <g transform="translate(30, 160)">
    <!-- Floating Speech Cues -->
    <g transform="translate(50, -45)" filter="url(#pillShadow)">
      <rect x="0" y="0" width="90" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" />
      <circle cx="12" cy="13" r="4" fill="#10B981" />
      <text x="22" y="16" fill="#0F172A" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Offer Sent! 📄</text>
    </g>
    <g transform="translate(68, -12)" filter="url(#pillShadow)">
      <rect x="0" y="0" width="100" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="10" y="15" fill="#0F172A" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">Onboarding 100% ✨</text>
    </g>

    <!-- Character Body -->
    <!-- Hair back -->
    <path d="M 35 70 C 15 70 10 120 18 160 C 25 190 40 180 40 160 Z" fill="#292524" />
    <path d="M 95 70 C 115 70 120 120 112 160 C 105 190 90 180 90 160 Z" fill="#292524" />

    <!-- Head & Neck -->
    <rect x="58" y="90" width="14" height="20" fill="#D97706" rx="3" />
    <ellipse cx="65" cy="72" rx="20" ry="24" fill="#FBBF24" />

    <!-- Hair front / bangs -->
    <path d="M 45 68 C 45 40 85 40 85 68 C 80 55 50 55 45 68 Z" fill="#292524" />
    <path d="M 45 65 C 40 85 46 110 50 115 C 48 100 48 80 50 68 Z" fill="#292524" />

    <!-- Glasses & Eyes -->
    <rect x="50" y="65" width="12" height="10" rx="3" fill="none" stroke="#0F172A" stroke-width="1.8" />
    <rect x="68" y="65" width="12" height="10" rx="3" fill="none" stroke="#0F172A" stroke-width="1.8" />
    <line x1="62" y1="70" x2="68" y2="70" stroke="#0F172A" stroke-width="1.8" />
    <!-- Smile -->
    <path d="M 60 84 Q 65 89 70 84" stroke="#92400E" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Blouse / Green Top -->
    <path d="M 40 110 L 90 110 L 105 210 L 25 210 Z" fill="#0D9488" />
    <polygon points="65,110 58,135 72,135" fill="#CCFBF1" />

    <!-- Folder / Clipboard in arms -->
    <g transform="translate(48, 140) rotate(-6)">
      <rect x="0" y="0" width="44" height="56" rx="4" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
      <rect x="8" y="10" width="28" height="4" rx="2" fill="#FFFFFF" />
      <rect x="8" y="18" width="22" height="3" rx="1.5" fill="#BAE6FD" />
      <rect x="8" y="25" width="25" height="3" rx="1.5" fill="#BAE6FD" />
      <!-- Clip -->
      <rect x="14" y="-4" width="16" height="8" rx="2" fill="#F1F5F9" stroke="#94A3B8" />
    </g>

    <!-- Arms holding folder -->
    <path d="M 32 115 C 26 135 34 165 48 168" stroke="#0D9488" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M 98 115 C 104 135 96 165 82 168" stroke="#0D9488" stroke-width="14" stroke-linecap="round" fill="none" />
    <!-- Hands -->
    <circle cx="50" cy="168" r="6" fill="#FBBF24" />
    <circle cx="82" cy="168" r="6" fill="#FBBF24" />
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT CHARACTER: MALE EMPLOYEE ON LAPTOP (Yellow Sweater)    -->
  <!-- ============================================================ -->
  <g transform="translate(710, 160)">
    <!-- Floating Employee Avatar Badge -->
    <g transform="translate(-15, -45)" filter="url(#pillShadow)">
      <circle cx="20" cy="20" r="18" fill="#FDE68A" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="20" cy="16" r="7" fill="#B45309" />
      <path d="M 10 32 C 10 26 15 24 20 24 C 25 24 30 26 30 32 Z" fill="#B45309" />
      <circle cx="32" cy="28" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
    </g>

    <!-- Head & Beard -->
    <rect x="58" y="90" width="14" height="20" fill="#78350F" rx="3" />
    <ellipse cx="65" cy="70" rx="19" ry="23" fill="#92400E" />

    <!-- Short Black Hair & Beard -->
    <path d="M 46 64 C 46 45 84 45 84 64 C 84 52 46 52 46 64 Z" fill="#18181B" />
    <!-- Full Beard -->
    <path d="M 48 76 C 48 95 82 95 82 76 L 80 82 C 75 96 55 96 50 82 Z" fill="#18181B" />

    <!-- Glasses & Eyes -->
    <rect x="50" y="64" width="11" height="9" rx="2" fill="none" stroke="#0F172A" stroke-width="1.6" />
    <rect x="67" y="64" width="11" height="9" rx="2" fill="none" stroke="#0F172A" stroke-width="1.6" />
    <line x1="61" y1="68" x2="67" y2="68" stroke="#0F172A" stroke-width="1.6" />

    <!-- Mustard/Yellow Knit Sweater -->
    <path d="M 35 110 L 95 110 L 115 210 L 15 210 Z" fill="#D97706" />

    <!-- Laptop in hands -->
    <g transform="translate(10, 150)">
      <!-- Laptop Screen angled -->
      <polygon points="35,0 80,-15 80,35 35,45" fill="#475569" stroke="#94A3B8" stroke-width="1" />
      <polygon points="38,3 77,-11 77,32 38,42" fill="#0284C7" />
      <text x="56" y="20" fill="#FFFFFF" font-family="monospace" font-size="8" font-weight="bold">HR</text>
      <!-- Laptop Base -->
      <polygon points="20,40 35,45 85,35 70,30" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1" />
    </g>

    <!-- Arms on keyboard -->
    <path d="M 40 115 C 32 135 38 165 48 172" stroke="#D97706" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M 90 115 C 80 135 75 160 68 170" stroke="#D97706" stroke-width="14" stroke-linecap="round" fill="none" />
    <!-- Hands -->
    <circle cx="48" cy="172" r="5" fill="#92400E" />
    <circle cx="68" cy="170" r="5" fill="#92400E" />
  </g>
</svg>
