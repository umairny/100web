<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%" fill="none">
  <defs>
    <filter id="valSh3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D97706" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Mini Analytics Chart Window on Left -->
  <g transform="translate(10, 15)" filter="url(#valSh3)">
    <rect x="0" y="0" width="150" height="130" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5" />
    <!-- Header -->
    <rect x="0" y="0" width="150" height="20" rx="10" fill="#FFFBEB" />
    <circle cx="10" cy="10" r="3" fill="#D97706" />
    <text x="20" y="13" fill="#B45309" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">Retention &amp; Growth</text>
    <rect x="110" y="5" width="32" height="10" rx="5" fill="#FEF3C7" />
    <text x="126" y="12.5" fill="#B45309" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" text-anchor="middle">+18.4%</text>

    <!-- Grid lines -->
    <line x1="16" y1="45" x2="134" y2="45" stroke="#F1F5F9" stroke-width="1" />
    <line x1="16" y1="75" x2="134" y2="75" stroke="#F1F5F9" stroke-width="1" />
    <line x1="16" y1="105" x2="134" y2="105" stroke="#F1F5F9" stroke-width="1" />

    <!-- Bar Chart Groups -->
    <g transform="translate(20, 40)">
      <!-- Col 1 -->
      <rect x="0" y="35" width="12" height="35" rx="3" fill="#38BDF8" />
      <rect x="14" y="45" width="12" height="25" rx="3" fill="#0284C7" />

      <!-- Col 2 -->
      <rect x="34" y="25" width="12" height="45" rx="3" fill="#34D399" />
      <rect x="48" y="32" width="12" height="38" rx="3" fill="#059669" />

      <!-- Col 3 -->
      <rect x="68" y="15" width="12" height="55" rx="3" fill="#A78BFA" />
      <rect x="82" y="20" width="12" height="50" rx="3" fill="#7C3AED" />

      <!-- Col 4 -->
      <rect x="102" y="5" width="12" height="65" rx="3" fill="#FBBF24" />
    </g>

    <!-- Trend line overlay -->
    <path d="M 26 80 L 60 70 L 94 58 L 128 42" stroke="#EF4444" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="128" cy="42" r="3" fill="#EF4444" />
  </g>

  <!-- Illustrated Analyst on Right -->
  <g transform="translate(165, 45)">
    <!-- Head -->
    <ellipse cx="28" cy="22" rx="12" ry="14" fill="#92400E" />
    <!-- Hair -->
    <path d="M 16 20 C 16 6 40 6 40 20 C 40 32 38 42 42 46 C 36 40 38 28 36 20 Z" fill="#18181B" />

    <!-- Glasses -->
    <rect x="19" y="18" width="7" height="6" rx="1.5" fill="none" stroke="#0F172A" stroke-width="1.2" />
    <rect x="29" y="18" width="7" height="6" rx="1.5" fill="none" stroke="#0F172A" stroke-width="1.2" />
    <line x1="26" y1="21" x2="29" y2="21" stroke="#0F172A" stroke-width="1.2" />

    <!-- Body / Mustard Sweater -->
    <path d="M 14 42 L 42 42 L 52 105 L 4 105 Z" fill="#D97706" />

    <!-- Holding iPad / tablet with analytics -->
    <g transform="translate(14, 55)">
      <rect x="0" y="0" width="26" height="34" rx="2" fill="#0F172A" stroke="#94A3B8" stroke-width="1" />
      <rect x="3" y="4" width="20" height="26" rx="1" fill="#38BDF8" />
      <line x1="6" y1="24" x2="20" y2="12" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <path d="M 12 46 C 8 60 14 75 20 75" stroke="#D97706" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 44 46 C 48 60 40 75 34 75" stroke="#D97706" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>
</svg>
