<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%" fill="none">
  <defs>
    <filter id="valSh2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient soft mint circle -->
  <circle cx="120" cy="80" r="65" fill="#ECFDF5" />

  <!-- Heart Pulse Badge Center Top -->
  <g transform="translate(108, 18)" filter="url(#valSh2)">
    <circle cx="12" cy="12" r="14" fill="#EF4444" stroke="#FFFFFF" stroke-width="2" />
    <path d="M 12 7 C 9 3 5 5 5 9 C 5 13 12 18 12 18 C 12 18 19 13 19 9 C 19 5 15 3 12 7 Z" fill="#FFFFFF" />
  </g>

  <!-- 3 Diverse Employee Avatars -->
  <!-- Left Avatar (Female with bun) -->
  <g transform="translate(40, 50)" filter="url(#valSh2)">
    <circle cx="28" cy="28" r="26" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2" />
    <!-- Hair bun -->
    <circle cx="28" cy="10" r="7" fill="#451A03" />
    <circle cx="28" cy="24" r="11" fill="#FBBF24" />
    <path d="M 17 26 C 17 14 39 14 39 26 Z" fill="#451A03" />
    <!-- Body -->
    <path d="M 14 48 C 14 38 21 36 28 36 C 35 36 42 38 42 48 Z" fill="#2563EB" />
    <!-- Star badge -->
    <circle cx="44" cy="16" r="7" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="44" y="19" fill="#FFFFFF" font-size="8" font-weight="bold" text-anchor="middle">★</text>
  </g>

  <!-- Center Avatar (Male with beard & glasses) -->
  <g transform="translate(92, 58)" filter="url(#valSh2)">
    <circle cx="28" cy="28" r="28" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2" />
    <!-- Hair & Beard -->
    <circle cx="28" cy="22" r="12" fill="#92400E" />
    <path d="M 16 18 C 16 8 40 8 40 18 Z" fill="#18181B" />
    <path d="M 18 24 C 18 36 38 36 38 24 Z" fill="#18181B" />
    <!-- Glasses -->
    <rect x="20" y="20" width="6" height="5" rx="1.5" fill="none" stroke="#0F172A" stroke-width="1" />
    <rect x="30" y="20" width="6" height="5" rx="1.5" fill="none" stroke="#0F172A" stroke-width="1" />
    <!-- Body -->
    <path d="M 12 50 C 12 40 20 38 28 38 C 36 38 44 40 44 50 Z" fill="#0D9488" />
    <!-- Thumbs up badge -->
    <circle cx="46" cy="18" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="46" y="21" fill="#FFFFFF" font-size="7" font-weight="bold" text-anchor="middle">👍</text>
  </g>

  <!-- Right Avatar (Female with short hair) -->
  <g transform="translate(144, 50)" filter="url(#valSh2)">
    <circle cx="28" cy="28" r="26" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2" />
    <!-- Hair -->
    <circle cx="28" cy="24" r="11" fill="#F59E0B" />
    <path d="M 17 24 C 17 12 39 12 39 24 C 39 20 17 20 17 24 Z" fill="#78350F" />
    <!-- Body -->
    <path d="M 14 48 C 14 38 21 36 28 36 C 35 36 42 38 42 48 Z" fill="#7C3AED" />
    <!-- Chat bubble badge -->
    <circle cx="44" cy="16" r="7" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="44" y="19" fill="#FFFFFF" font-size="7" font-weight="bold" text-anchor="middle">💬</text>
  </g>

  <!-- Collaboration Connection Arcs -->
  <path d="M 68 85 Q 120 115 172 85" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3" fill="none" />
  <circle cx="120" cy="100" r="4" fill="#10B981" />
</svg>
