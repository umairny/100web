<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%" fill="none">
  <defs>
    <filter id="valSh1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Mini Dashboard Window -->
  <g transform="translate(10, 15)" filter="url(#valSh1)">
    <rect x="0" y="0" width="150" height="130" rx="10" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" />
    <rect x="0" y="0" width="150" height="20" rx="10" fill="#F0F9FF" />
    <circle cx="10" cy="10" r="3" fill="#0284C7" />
    <rect x="20" y="7" width="50" height="6" rx="3" fill="#BAE6FD" />

    <!-- Task list items -->
    <g transform="translate(10, 30)">
      <rect x="0" y="0" width="130" height="18" rx="4" fill="#F8FAFC" />
      <circle cx="9" cy="9" r="4" fill="#10B981" />
      <rect x="18" y="7" width="60" height="4" rx="2" fill="#64748B" />
      <rect x="95" y="5" width="26" height="8" rx="4" fill="#DCFCE7" />
    </g>

    <g transform="translate(10, 54)">
      <rect x="0" y="0" width="130" height="18" rx="4" fill="#F8FAFC" />
      <circle cx="9" cy="9" r="4" fill="#10B981" />
      <rect x="18" y="7" width="70" height="4" rx="2" fill="#64748B" />
      <rect x="95" y="5" width="26" height="8" rx="4" fill="#DCFCE7" />
    </g>

    <g transform="translate(10, 78)">
      <rect x="0" y="0" width="130" height="18" rx="4" fill="#F8FAFC" />
      <circle cx="9" cy="9" r="4" fill="#0284C7" />
      <rect x="18" y="7" width="55" height="4" rx="2" fill="#64748B" />
      <rect x="95" y="5" width="26" height="8" rx="4" fill="#E0F2FE" />
    </g>

    <g transform="translate(10, 102)">
      <rect x="0" y="0" width="130" height="18" rx="4" fill="#F8FAFC" />
      <circle cx="9" cy="9" r="4" fill="#F59E0B" />
      <rect x="18" y="7" width="65" height="4" rx="2" fill="#64748B" />
      <rect x="95" y="5" width="26" height="8" rx="4" fill="#FEF3C7" />
    </g>
  </g>

  <!-- Illustrated Character standing on the right -->
  <g transform="translate(160, 45)">
    <!-- Head -->
    <ellipse cx="28" cy="22" rx="12" ry="14" fill="#FBBF24" />
    <!-- Hair -->
    <path d="M 16 18 C 16 4 40 4 40 18 C 38 10 18 10 16 18 Z" fill="#1E293B" />
    <!-- Glasses -->
    <rect x="19" y="18" width="7" height="6" rx="1.5" fill="none" stroke="#0F172A" stroke-width="1.2" />
    <rect x="29" y="18" width="7" height="6" rx="1.5" fill="none" stroke="#0F172A" stroke-width="1.2" />
    <line x1="26" y1="21" x2="29" y2="21" stroke="#0F172A" stroke-width="1.2" />

    <!-- Body / Green Shirt -->
    <path d="M 14 42 L 42 42 L 52 105 L 4 105 Z" fill="#0D9488" />

    <!-- Laptop in hands -->
    <g transform="translate(18, 55)">
      <polygon points="0,15 15,20 30,10 15,5" fill="#CBD5E1" stroke="#64748B" stroke-width="1" />
      <polygon points="15,20 15,-5 0,0 0,15" fill="#475569" />
    </g>
    <path d="M 12 46 C 8 60 14 75 22 75" stroke="#0D9488" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 44 46 C 48 60 40 75 32 75" stroke="#0D9488" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>
</svg>
