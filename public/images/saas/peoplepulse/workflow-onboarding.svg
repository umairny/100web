<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" width="100%" height="100%" fill="none">
  <defs>
    <filter id="cardSh1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Base Dashboard Window -->
  <g transform="translate(15, 12)" filter="url(#cardSh1)">
    <rect x="0" y="0" width="230" height="156" rx="12" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" />

    <!-- Header bar -->
    <rect x="0" y="0" width="230" height="28" rx="12" fill="#F0F9FF" />
    <rect x="0" y="16" width="230" height="12" fill="#F0F9FF" />
    <line x1="0" y1="28" x2="230" y2="28" stroke="#E0F2FE" stroke-width="1" />
    <circle cx="14" cy="14" r="3" fill="#38BDF8" />
    <text x="24" y="17" fill="#0369A1" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">New Hire Onboarding Journey</text>
    <rect x="168" y="8" width="50" height="13" rx="6.5" fill="#DCFCE7" />
    <text x="193" y="17" fill="#15803D" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Day 1 Ready</text>

    <!-- Checklist Item 1 -->
    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="206" height="24" rx="6" fill="#F8FAFC" />
      <circle cx="12" cy="12" r="6" fill="#10B981" />
      <path d="M 9 12 L 11 14 L 15 10" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
      <text x="24" y="12" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Sign Employment Agreement</text>
      <text x="24" y="19" fill="#64748B" font-family="system-ui, sans-serif" font-size="6.5">Signed via DocuSign • Completed</text>
    </g>

    <!-- Checklist Item 2 -->
    <g transform="translate(12, 66)">
      <rect x="0" y="0" width="206" height="24" rx="6" fill="#F8FAFC" />
      <circle cx="12" cy="12" r="6" fill="#10B981" />
      <path d="M 9 12 L 11 14 L 15 10" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
      <text x="24" y="12" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Direct Deposit &amp; W-4 Form</text>
      <text x="24" y="19" fill="#64748B" font-family="system-ui, sans-serif" font-size="6.5">Bank verified via Plaid</text>
    </g>

    <!-- Checklist Item 3 -->
    <g transform="translate(12, 94)">
      <rect x="0" y="0" width="206" height="24" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <circle cx="12" cy="12" r="6" fill="#2563EB" />
      <text x="12" y="15" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">⟳</text>
      <text x="24" y="12" fill="#1E3A8A" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Laptop &amp; Software Provisioning</text>
      <text x="24" y="19" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="6.5">Slack, Google Workspace, GitHub access</text>
    </g>

    <!-- Progress Bar -->
    <g transform="translate(12, 128)">
      <div class="flex justify-between">
        <text x="0" y="8" fill="#64748B" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">Overall Progress: 85%</text>
      </div>
      <rect x="0" y="12" width="206" height="6" rx="3" fill="#E2E8F0" />
      <rect x="0" y="12" width="175" height="6" rx="3" fill="#0284C7" />
    </g>
  </g>
</svg>
