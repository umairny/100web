<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" width="100%" height="100%" fill="none">
  <defs>
    <filter id="cardSh3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#059669" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Base Dashboard Window -->
  <g transform="translate(15, 12)" filter="url(#cardSh3)">
    <rect x="0" y="0" width="230" height="156" rx="12" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" />

    <!-- Header bar -->
    <rect x="0" y="0" width="230" height="28" rx="12" fill="#ECFDF5" />
    <rect x="0" y="16" width="230" height="12" fill="#ECFDF5" />
    <line x1="0" y1="28" x2="230" y2="28" stroke="#D1FAE5" stroke-width="1" />
    <circle cx="14" cy="14" r="3" fill="#10B981" />
    <text x="24" y="17" fill="#065F46" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">Continuous Performance Cycle</text>
    <rect x="170" y="8" width="48" height="13" rx="6.5" fill="#DEF7EC" />
    <text x="194" y="17" fill="#047857" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Q3 Review</text>

    <!-- Goal 1 -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="206" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="10" y="14" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">OKR: Launch Mobile Design System v2</text>
      <text x="180" y="14" fill="#059669" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">92%</text>
      <!-- Progress bar -->
      <rect x="10" y="20" width="186" height="5" rx="2.5" fill="#E2E8F0" />
      <rect x="10" y="20" width="171" height="5" rx="2.5" fill="#10B981" />
    </g>

    <!-- 360 Feedback Card -->
    <g transform="translate(12, 76)">
      <rect x="0" y="0" width="206" height="68" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
      <div class="flex items-center">
        <text x="10" y="16" fill="#14532D" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">Peer 360 Feedback • 4 Reviews</text>
      </div>
      <!-- Star ratings -->
      <g transform="translate(10, 24)">
        <text x="0" y="8" fill="#F59E0B" font-size="10">★★★★★</text>
        <text x="65" y="8" fill="#065F46" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">4.9 / 5.0 Rating</text>
      </g>
      <!-- Reviewer Avatars & Comment snippet -->
      <g transform="translate(10, 42)">
        <circle cx="8" cy="8" r="8" fill="#3B82F6" />
        <circle cx="20" cy="8" r="8" fill="#10B981" />
        <circle cx="32" cy="8" r="8" fill="#A855F7" />
        <circle cx="44" cy="8" r="8" fill="#F59E0B" />
        <text x="60" y="7" fill="#166534" font-family="system-ui, sans-serif" font-size="7" font-style="italic">&ldquo;Incredible leadership &amp; cross-team empathy.&rdquo;</text>
        <text x="60" y="15" fill="#65A30D" font-family="system-ui, sans-serif" font-size="6.5">— Engineering &amp; Product Team</text>
      </g>
    </g>
  </g>
</svg>
