<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" width="100%" height="100%" fill="none">
  <defs>
    <filter id="cardSh2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6B21A8" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Base Dashboard Window -->
  <g transform="translate(15, 12)" filter="url(#cardSh2)">
    <rect x="0" y="0" width="230" height="156" rx="12" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5" />

    <!-- Top Profile Bar -->
    <g transform="translate(12, 14)">
      <circle cx="16" cy="16" r="16" fill="#EDE9FE" />
      <circle cx="16" cy="14" r="7" fill="#7C3AED" />
      <path d="M 6 28 C 6 22 11 20 16 20 C 21 20 26 22 26 28 Z" fill="#7C3AED" />

      <text x="38" y="14" fill="#0F172A" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">Mia Alvarez</text>
      <text x="38" y="23" fill="#6B7280" font-family="system-ui, sans-serif" font-size="7">Senior Product Designer • Design Team</text>

      <rect x="145" y="6" width="60" height="16" rx="8" fill="#F3E8FF" />
      <text x="175" y="17" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Self-Service Active</text>
    </g>

    <!-- Quick Action 4-Grid -->
    <g transform="translate(12, 54)">
      <!-- Action 1: PTO Request -->
      <g>
        <rect x="0" y="0" width="98" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="16" cy="19" r="10" fill="#EDE9FE" />
        <text x="16" y="22" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">✈</text>
        <text x="32" y="16" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Request PTO</text>
        <text x="32" y="25" fill="#16A34A" font-family="system-ui, sans-serif" font-size="6.5">18 days left</text>
      </g>

      <!-- Action 2: Pay Stubs -->
      <g transform="translate(108, 0)">
        <rect x="0" y="0" width="98" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="16" cy="19" r="10" fill="#DCFCE7" />
        <text x="16" y="22" fill="#15803D" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">$</text>
        <text x="32" y="16" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Pay Stubs</text>
        <text x="32" y="25" fill="#64748B" font-family="system-ui, sans-serif" font-size="6.5">Next: Oct 31</text>
      </g>

      <!-- Action 3: Org Chart -->
      <g transform="translate(0, 44)">
        <rect x="0" y="0" width="98" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="16" cy="19" r="10" fill="#EFF6FF" />
        <text x="16" y="22" fill="#2563EB" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">👥</text>
        <text x="32" y="16" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Org Chart</text>
        <text x="32" y="25" fill="#64748B" font-family="system-ui, sans-serif" font-size="6.5">5 reports</text>
      </g>

      <!-- Action 4: Perks & Benefits -->
      <g transform="translate(108, 44)">
        <rect x="0" y="0" width="98" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="16" cy="19" r="10" fill="#FEF3C7" />
        <text x="16" y="22" fill="#D97706" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">★</text>
        <text x="32" y="16" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold">Benefits</text>
        <text x="32" y="25" fill="#64748B" font-family="system-ui, sans-serif" font-size="6.5">Health &amp; 401(k)</text>
      </g>
    </g>

    <!-- Bottom Notification line -->
    <rect x="12" y="138" width="206" height="4" rx="2" fill="#EDE9FE" />
    <rect x="12" y="138" width="80" height="4" rx="2" fill="#7C3AED" />
  </g>
</svg>
