<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" width="100%" height="100%" fill="none">
  <defs>
    <filter id="cardSh4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#D97706" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Base Dashboard Window -->
  <g transform="translate(15, 12)" filter="url(#cardSh4)">
    <rect x="0" y="0" width="230" height="156" rx="12" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5" />

    <!-- Header bar -->
    <rect x="0" y="0" width="230" height="28" rx="12" fill="#FFFBEB" />
    <rect x="0" y="16" width="230" height="12" fill="#FFFBEB" />
    <line x1="0" y1="28" x2="230" y2="28" stroke="#FEF3C7" stroke-width="1" />
    <circle cx="14" cy="14" r="3" fill="#F59E0B" />
    <text x="24" y="17" fill="#92400E" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold">Employee Directory &amp; Compliance</text>
    <rect x="165" y="8" width="54" height="13" rx="6.5" fill="#FEF3C7" />
    <text x="192" y="17" fill="#B45309" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">Smart Export</text>

    <!-- Data Table Header -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="206" height="16" rx="4" fill="#F8FAFC" />
      <text x="8" y="11" fill="#64748B" font-family="system-ui, sans-serif" font-size="6.5" font-weight="bold">EMPLOYEE</text>
      <text x="80" y="11" fill="#64748B" font-family="system-ui, sans-serif" font-size="6.5" font-weight="bold">DEPT</text>
      <text x="130" y="11" fill="#64748B" font-family="system-ui, sans-serif" font-size="6.5" font-weight="bold">LOCATION</text>
      <text x="180" y="11" fill="#64748B" font-family="system-ui, sans-serif" font-size="6.5" font-weight="bold">STATUS</text>
    </g>

    <!-- Table Row 1 -->
    <g transform="translate(12, 56)">
      <circle cx="8" cy="8" r="7" fill="#EFF6FF" />
      <text x="8" y="10" fill="#2563EB" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">SJ</text>
      <text x="20" y="7" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">Sarah Jenkins</text>
      <text x="20" y="14" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="6">Product Design</text>
      <text x="80" y="10" fill="#475569" font-family="system-ui, sans-serif" font-size="7">Design</text>
      <text x="130" y="10" fill="#475569" font-family="system-ui, sans-serif" font-size="7">New York, US</text>
      <rect x="175" y="3" width="28" height="12" rx="6" fill="#DCFCE7" />
      <text x="189" y="11.5" fill="#16A34A" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" text-anchor="middle">Active</text>
    </g>

    <!-- Table Row 2 -->
    <g transform="translate(12, 78)">
      <circle cx="8" cy="8" r="7" fill="#FDF4FF" />
      <text x="8" y="10" fill="#9333EA" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">MV</text>
      <text x="20" y="7" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">Marcus Vance</text>
      <text x="20" y="14" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="6">Eng Lead</text>
      <text x="80" y="10" fill="#475569" font-family="system-ui, sans-serif" font-size="7">Eng</text>
      <text x="130" y="10" fill="#475569" font-family="system-ui, sans-serif" font-size="7">Austin, US</text>
      <rect x="175" y="3" width="28" height="12" rx="6" fill="#DCFCE7" />
      <text x="189" y="11.5" fill="#16A34A" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" text-anchor="middle">Active</text>
    </g>

    <!-- Table Row 3 -->
    <g transform="translate(12, 100)">
      <circle cx="8" cy="8" r="7" fill="#FEF3C7" />
      <text x="8" y="10" fill="#D97706" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle">AC</text>
      <text x="20" y="7" fill="#0F172A" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">Alex Chen</text>
      <text x="20" y="14" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="6">Talent Partner</text>
      <text x="80" y="10" fill="#475569" font-family="system-ui, sans-serif" font-size="7">People</text>
      <text x="130" y="10" fill="#475569" font-family="system-ui, sans-serif" font-size="7">London, UK</text>
      <rect x="175" y="3" width="28" height="12" rx="6" fill="#DCFCE7" />
      <text x="189" y="11.5" fill="#16A34A" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" text-anchor="middle">Active</text>
    </g>

    <!-- Bottom summary row -->
    <g transform="translate(12, 126)">
      <rect x="0" y="0" width="206" height="20" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
      <text x="8" y="13" fill="#92400E" font-family="system-ui, sans-serif" font-size="7" font-weight="bold">✓ 100% I-9 &amp; Work Eligibility Verification Compliant</text>
