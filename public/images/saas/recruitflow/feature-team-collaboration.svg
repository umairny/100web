  <circle cx="66" cy="25" r="1.5" fill="#FFFFFF" />
  <circle cx="72" cy="25" r="1.5" fill="#FFFFFF" />
  <circle cx="78" cy="25" r="1.5" fill="#FFFFFF" />

  <rect x="98" y="14" width="45" height="20" rx="6" fill="#10B981" />
