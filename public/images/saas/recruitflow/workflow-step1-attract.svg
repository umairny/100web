<svg width="180" height="130" viewBox="0 0 180 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Step circle badge -->
  <circle cx="24" cy="24" r="14" fill="#2563EB" />
  <text x="20" y="29" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="900">1</text>

  <!-- Megaphone Body -->
  <g transform="translate(45, 30)">
    <!-- Cone -->
    <polygon points="20,35 65,15 65,55 20,42" fill="#38BDF8" stroke="#0284C7" stroke-width="2" stroke-linejoin="round" />
    <ellipse cx="65" cy="35" rx="6" ry="20" fill="#BAE6FD" stroke="#0284C7" stroke-width="2" />
    
    <!-- Base / Handle -->
    <rect x="5" y="32" width="16" height="14" rx="2" fill="#EA580C" stroke="#C2410C" stroke-width="1.5" />
    <path d="M10 46L14 62H22L18 46Z" fill="#EA580C" stroke="#C2410C" stroke-width="1.5" />

    <!-- Broadcast sound waves -->
    <path d="M78 20C84 25, 84 45, 78 50" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M86 12C96 22, 96 48, 86 58" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Distributed Job Post Badge on Right -->
  <g transform="translate(130, 42)">
    <rect width="36" height="46" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="5" y="6" width="16" height="4" rx="2" fill="#2563EB" />
    <line x1="5" y1="16" x2="31" y2="16" stroke="#94A3B8" stroke-width="2" />
    <line x1="5" y1="22" x2="26" y2="22" stroke="#94A3B8" stroke-width="2" />
    <line x1="5" y1="28" x2="22" y2="28" stroke="#94A3B8" stroke-width="2" />
    <circle cx="26" cy="36" r="4" fill="#10B981" />
  </g>
</svg>
