<svg width="180" height="130" viewBox="0 0 180 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Step circle badge -->
  <circle cx="24" cy="24" r="14" fill="#2563EB" />
  <text x="20" y="29" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="900">2</text>

  <!-- Kanban Board Frame -->
  <g transform="translate(42, 26)">
    <rect width="128" height="85" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect width="128" height="18" rx="6" fill="#F8FAFC" />
    <text x="8" y="13" fill="#64748B" font-family="sans-serif" font-size="7" font-weight="700">Applied</text>
    <text x="48" y="13" fill="#2563EB" font-family="sans-serif" font-size="7" font-weight="700">Interview</text>
    <text x="96" y="13" fill="#16A34A" font-family="sans-serif" font-size="7" font-weight="700">Offer</text>

    <!-- Column 1 Card -->
    <rect x="6" y="24" width="34" height="26" rx="3" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="14" cy="33" r="3" fill="#94A3B8" />
    <rect x="20" y="32" width="16" height="3" rx="1.5" fill="#94A3B8" />

    <!-- Column 2 Card (In Motion / Active) -->
    <rect x="46" y="24" width="36" height="32" rx="3" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
    <circle cx="54" cy="34" r="3.5" fill="#2563EB" />
    <rect x="61" y="33" width="16" height="3" rx="1.5" fill="#2563EB" />
    <rect x="52" y="44" width="24" height="6" rx="3" fill="#DCFCE7" />
    <text x="56" y="49" fill="#166534" font-family="sans-serif" font-size="6" font-weight="700">Pass</text>

    <!-- Column 3 Card -->
    <rect x="88" y="24" width="34" height="26" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
    <circle cx="96" cy="33" r="3" fill="#16A34A" />
    <rect x="102" y="32" width="16" height="3" rx="1.5" fill="#16A34A" />

    <!-- Drag arrow indicator -->
    <path d="M40 37 C 44 37, 44 37, 46 37" stroke="#2563EB" stroke-width="1.5" fill="none" />
  </g>
</svg>
