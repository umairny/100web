    <rect x="75" y="0" width="6" height="18" rx="2" fill="#BAE6FD" />
    <rect x="84" y="-8" width="6" height="26" rx="2" fill="#38BDF8" />
    <rect x="93" y="-18" width="6" height="36" rx="2" fill="#10B981" />
