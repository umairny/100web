<svg width="180" height="130" viewBox="0 0 180 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Step circle badge -->
  <circle cx="24" cy="24" r="14" fill="#2563EB" />
  <text x="20" y="29" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="900">4</text>

  <!-- Handshake Illustration -->
  <g transform="translate(45, 30)">
    <!-- Left Hand / Cuff (Blue shirt) -->
    <path d="M5 28L20 28L32 40L24 48L12 42L5 42Z" fill="#1D4ED8" />
