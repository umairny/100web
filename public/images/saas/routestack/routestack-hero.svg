<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528" />
      <stop offset="50%" stop-color="#0F2440" />
      <stop offset="100%" stop-color="#060D19" />
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05" />
    </linearGradient>

    <!-- Isometric Road Fill -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Neon Route Path Glows -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="neonGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Canvas Backdrop with Ambient Grid -->
  <rect width="900" height="620" rx="24" fill="url(#bgGrad)" />
  
  <!-- Subtle Isometric Grid Lines -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1">
    <path d="M-100 200 L500 500 L1100 200" />
    <path d="M-100 280 L500 580 L1100 280" />
    <path d="M-100 360 L500 660 L1100 360" />
    <path d="M-100 120 L500 420 L1100 120" />
    <path d="M200 -50 L700 200 L200 450" />
    <path d="M350 -50 L850 200 L350 450" />
    <path d="M500 -50 L1000 200 L500 450" />
  </g>

  <!-- Isometric Ground Plane Platform -->
  <g transform="translate(450, 360)">
    <!-- Base 3D block -->
    <path d="M0 -180 L380 -20 L0 140 L-380 -20 Z" fill="#132238" stroke="#1E3A5F" stroke-width="2" />
    <path d="M-380 -20 L0 140 L0 175 L-380 15 Z" fill="#0A1424" />
    <path d="M0 140 L380 -20 L380 15 L0 175 Z" fill="#0E1A2D" />

    <!-- Isometric Roads Highway Network -->
    <!-- North-West to South-East Highway -->
    <path d="M-280 -70 L280 15 L240 32 L-320 -53 Z" fill="url(#roadGrad)" />
    <!-- South-West to North-East Highway -->
    <path d="M-200 65 L220 -115 L255 -100 L-165 80 Z" fill="url(#roadGrad)" />

    <!-- Dashed Center Highway Lanes -->
    <path d="M-270 -64 L260 22" stroke="#F59E0B" stroke-width="2" stroke-dasharray="10 8" opacity="0.7" />
    <path d="M-180 72 L235 -106" stroke="#94A3B8" stroke-width="2" stroke-dasharray="10 8" opacity="0.6" />

    <!-- Intersection Hub Circular Node -->
    <ellipse cx="20" cy="-20" rx="75" ry="38" fill="#1E293B" stroke="#334155" stroke-width="2" />
    <ellipse cx="20" cy="-20" rx="45" ry="22" fill="#0F172A" stroke="#38BDF8" stroke-width="2" opacity="0.8" />
    <ellipse cx="20" cy="-20" rx="15" ry="8" fill="#10B981" />

    <!-- Glowing Active Multi-Stop Route Path in Neon Cyan and Green -->
    <path d="M-240 -50 Q-100 -60 20 -20 T180 -80" 
          stroke="#00F2FE" stroke-width="5" fill="none" filter="url(#neonGlowCyan)" stroke-linecap="round" />
    <path d="M-240 -50 Q-100 -60 20 -20 T180 -80" 
          stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />

    <path d="M20 -20 Q120 10 200 40" 
          stroke="#10B981" stroke-width="4" fill="none" filter="url(#neonGlowGreen)" stroke-linecap="round" stroke-dasharray="8 6" />

    <!-- Route Waypoint GPS Location Pins -->
    <!-- Pin 1 -->
    <g transform="translate(-240, -65)">
      <circle cx="0" cy="0" r="14" fill="#0284C7" stroke="#38BDF8" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
      <text x="0" y="4" fill="#0284C7" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">A</text>
    </g>

    <!-- Pin 2 (Intersection) -->
    <g transform="translate(20, -42)">
      <circle cx="0" cy="0" r="15" fill="#10B981" stroke="#34D399" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
      <text x="0" y="4" fill="#065F46" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">B</text>
    </g>

    <!-- Pin 3 -->
    <g transform="translate(180, -98)">
      <circle cx="0" cy="0" r="14" fill="#F97316" stroke="#FDBA74" stroke-width="2" />
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
      <text x="0" y="4" fill="#9A3412" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">C</text>
    </g>

    <!-- Isometric Delivery Vehicles -->
    <!-- Vehicle 1: Large White/Cyan Box Delivery Truck (Facing Right) -->
    <g transform="translate(120, -60)">
      <!-- Truck Shadow -->
      <ellipse cx="0" cy="22" rx="42" ry="14" fill="#000000" opacity="0.5" />
      <!-- Cargo Box -->
      <path d="M-30 0 L5 16 L5 -25 L-30 -40 Z" fill="#F8FAFC" />
      <path d="M5 16 L35 0 L35 -40 L5 -25 Z" fill="#E2E8F0" />
      <path d="M-30 -40 L5 -25 L35 -40 L0 -55 Z" fill="#FFFFFF" />
      <!-- Truck Brand Strip on Cargo -->
      <path d="M-25 -5 L5 9 L5 13 L-25 -1 Z" fill="#0284C7" />
      <path d="M5 9 L30 -3 L30 1 L5 13 Z" fill="#0369A1" />
      <!-- Cab -->
      <path d="M5 16 L22 24 L22 0 L5 -8 Z" fill="#0284C7" />
      <path d="M22 24 L38 16 L38 -8 L22 0 Z" fill="#0369A1" />
      <path d="M5 -8 L22 0 L38 -8 L20 -15 Z" fill="#38BDF8" />
      <!-- Windshield -->
      <path d="M22 -1 L34 -7 L34 -2 L22 4 Z" fill="#93C5FD" opacity="0.9" />
      <!-- Wheels -->
      <ellipse cx="-15" cy="18" rx="7" ry="5" fill="#0F172A" />
      <ellipse cx="25" cy="20" rx="7" ry="5" fill="#0F172A" />
    </g>

    <!-- Vehicle 2: Orange Last-Mile Van (Facing Center) -->
    <g transform="translate(-160, -20)">
      <ellipse cx="0" cy="15" rx="30" ry="10" fill="#000000" opacity="0.5" />
      <!-- Van Body -->
      <path d="M-22 0 L6 13 L6 -15 L-22 -26 Z" fill="#F97316" />
      <path d="M6 13 L28 2 L28 -16 L6 -15 Z" fill="#EA580C" />
      <path d="M-22 -26 L6 -15 L28 -26 L0 -35 Z" fill="#FB923C" />
      <!-- Windshield -->
      <path d="M6 -5 L22 -13 L22 -8 L6 0 Z" fill="#FEF08A" opacity="0.8" />
      <ellipse cx="-10" cy="12" rx="5" ry="4" fill="#0F172A" />
      <ellipse cx="18" cy="11" rx="5" ry="4" fill="#0F172A" />
    </g>

    <!-- Vehicle 3: Yellow/Amber Delivery Van (Driving South) -->
    <g transform="translate(100, 35)">
      <ellipse cx="0" cy="15" rx="28" ry="10" fill="#000000" opacity="0.4" />
      <path d="M-20 0 L4 11 L4 -14 L-20 -23 Z" fill="#EAB308" />
      <path d="M4 11 L24 2 L24 -15 L4 -14 Z" fill="#CA8A04" />
      <path d="M-20 -23 L4 -14 L24 -23 L0 -31 Z" fill="#FDE047" />
      <ellipse cx="-8" cy="11" rx="5" ry="4" fill="#0F172A" />
      <ellipse cx="16" cy="9" rx="5" ry="4" fill="#0F172A" />
    </g>

    <!-- Isometric Modern Depot / Hub Buildings in Background -->
    <g transform="translate(-190, -140)">
      <path d="M-40 0 L10 22 L10 -40 L-40 -60 Z" fill="#1E293B" stroke="#334155" />
      <path d="M10 22 L60 0 L60 -60 L10 -40 Z" fill="#0F172A" stroke="#334155" />
      <path d="M-40 -60 L10 -40 L60 -60 L10 -80 Z" fill="#334155" />
      <!-- Glowing Dock Bay Door -->
      <path d="M-25 -5 L-5 4 L-5 -22 L-25 -30 Z" fill="#38BDF8" opacity="0.8" />
    </g>
    <g transform="translate(230, -170)">
      <path d="M-30 0 L15 20 L15 -35 L-30 -52 Z" fill="#1E293B" stroke="#334155" />
      <path d="M15 20 L55 0 L55 -52 L15 -35 Z" fill="#0F172A" stroke="#334155" />
      <path d="M-30 -52 L15 -35 L55 -52 L10 -68 Z" fill="#334155" />
    </g>
  </g>

  <!-- Floating UI Metric HUD Cards (Top Right and Left) -->

  <!-- Top-Right Floating Card: Route Performance and Fuel Speedometer -->
  <g transform="translate(620, 50)" filter="url(#shadowBox)">
    <rect width="240" height="155" rx="16" fill="#0B132B" stroke="#1E3A5F" stroke-width="1.5" />
    <!-- Header -->
    <text x="18" y="28" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Fleet Speed &amp; Fuel</text>
    <circle cx="218" cy="24" r="5" fill="#10B981" />
    
    <!-- Fuel Gauge Dial Arc -->
    <g transform="translate(75, 95)">
      <!-- Background Gauge Arc -->
      <path d="M-45 0 A 45 45 0 0 1 45 0" stroke="#1E293B" stroke-width="10" fill="none" stroke-linecap="round" />
      <!-- Active Gauge Arc (Green to Amber) -->
      <path d="M-45 0 A 45 45 0 0 1 25 -37" stroke="#10B981" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#neonGlowGreen)" />
      <!-- Gauge Needle -->
      <line x1="0" y1="0" x2="18" y2="-26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="0" r="6" fill="#F8FAFC" />
      <!-- Gauge Center Value -->
      <text x="0" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">94.8%</text>
      <text x="0" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Fuel Efficiency</text>
    </g>

    <!-- Side Stats -->
    <g transform="translate(155, 60)">
      <text x="0" y="15" fill="#94A3B8" font-size="10" font-family="sans-serif">Avg Speed</text>
      <text x="0" y="32" fill="#38BDF8" font-size="16" font-family="sans-serif" font-weight="bold">42 mph</text>
      <text x="0" y="55" fill="#94A3B8" font-size="10" font-family="sans-serif">Saved Miles</text>
      <text x="0" y="72" fill="#10B981" font-size="16" font-family="sans-serif" font-weight="bold">-28.4%</text>
    </g>
  </g>

  <!-- Top-Left Floating Card: Delivery Timeline and On-Time Rate -->
  <g transform="translate(45, 60)" filter="url(#shadowBox)">
    <rect width="250" height="145" rx="16" fill="#0B132B" stroke="#1E3A5F" stroke-width="1.5" />
    <text x="18" y="26" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">On-Time Dispatch</text>
    <rect x="180" y="14" width="54" height="20" rx="10" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" />
    <text x="207" y="28" fill="#10B981" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">99.2%</text>

    <!-- Mini Ascending Bar Chart -->
    <g transform="translate(20, 115)">
      <!-- Bar 1 -->
      <rect x="0" y="-30" width="16" height="30" rx="3" fill="#1E3A5F" />
      <text x="8" y="14" fill="#64748B" font-size="9" text-anchor="middle">08:00</text>
      <!-- Bar 2 -->
      <rect x="30" y="-45" width="16" height="45" rx="3" fill="#0284C7" />
      <text x="38" y="14" fill="#64748B" font-size="9" text-anchor="middle">10:00</text>
      <!-- Bar 3 -->
      <rect x="60" y="-60" width="16" height="60" rx="3" fill="#0284C7" />
      <text x="68" y="14" fill="#64748B" font-size="9" text-anchor="middle">12:00</text>
      <!-- Bar 4 -->
      <rect x="90" y="-75" width="16" height="75" rx="3" fill="#38BDF8" />
      <text x="98" y="14" fill="#64748B" font-size="9" text-anchor="middle">14:00</text>
      <!-- Bar 5 -->
      <rect x="120" y="-55" width="16" height="55" rx="3" fill="#10B981" />
      <text x="128" y="14" fill="#64748B" font-size="9" text-anchor="middle">16:00</text>
      <!-- Bar 6 (Peak) -->
      <rect x="150" y="-80" width="16" height="80" rx="3" fill="#10B981" filter="url(#neonGlowGreen)" />
      <text x="158" y="14" fill="#10B981" font-size="9" font-weight="bold" text-anchor="middle">18:00</text>
      <!-- Target dashed line -->
      <line x1="0" y1="-65" x2="190" y2="-65" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3" />
    </g>
  </g>

  <!-- Bottom Floating Notification: Dispatch Dispatched -->
  <g transform="translate(60, 530)" filter="url(#shadowBox)">
    <rect width="320" height="60" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <circle cx="30" cy="30" r="14" fill="#10B981" fill-opacity="0.2" />
    <path d="M24 30 L28 34 L36 26" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="56" y="26" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">Fleet Batch #104 Optimized</text>
    <text x="56" y="44" fill="#94A3B8" font-size="11" font-family="system-ui, sans-serif">18 drivers dispatched • 240 stops sequenced</text>
  </g>
</svg>
