<svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="driverSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <!-- Driver Avatar -->
  <g transform="translate(10, 10)">
    <!-- Uniform Shoulders / Collar -->
    <path d="M15 130 C15 95 35 85 55 85 C75 85 95 95 95 130 Z" fill="#0284C7" />
    <!-- Shirt Collar details -->
    <path d="M45 85 L55 105 L65 85 Z" fill="#FFFFFF" />
    <path d="M55 105 L55 130" stroke="#0369A1" stroke-width="2" />

    <!-- Head -->
    <circle cx="55" cy="55" r="24" fill="url(#driverSkin)" />
    <!-- Ears -->
    <circle cx="31" cy="55" r="5" fill="#F59E0B" />
    <circle cx="79" cy="55" r="5" fill="#F59E0B" />
    
    <!-- Eyes and Smile -->
    <circle cx="47" cy="52" r="2.5" fill="#1E293B" />
    <circle cx="63" cy="52" r="2.5" fill="#1E293B" />
    <path d="M48 64 Q55 70 62 64" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Driver Cap -->
    <path d="M30 46 C30 25 80 25 80 46 Z" fill="url(#capGrad)" />
    <!-- Cap Visor -->
    <path d="M26 45 C45 42 75 42 90 48 C75 52 40 52 26 45 Z" fill="#0369A1" />
    <!-- Cap Badge (mini compass) -->
    <circle cx="55" cy="36" r="4.5" fill="#38BDF8" />
  </g>

  <!-- Stopwatch / Timer (Productivity) -->
  <g transform="translate(95, 45)">
    <!-- Shadow -->
    <circle cx="28" cy="35" r="25" fill="#000000" opacity="0.15" />
    <!-- Stopwatch Rim -->
    <circle cx="25" cy="30" r="25" fill="#FFFFFF" stroke="#0284C7" stroke-width="4" />
    <circle cx="25" cy="30" r="21" fill="#F0F9FF" />
    
    <!-- Top Button -->
    <rect x="22" y="1" width="6" height="5" rx="1.5" fill="#0369A1" />
    <rect x="18" y="4" width="14" height="2" rx="1" fill="#0284C7" />
    <!-- Side Lap Button -->
    <rect x="42" y="10" width="4" height="6" rx="1.5" transform="rotate(35 42 10)" fill="#0369A1" />

    <!-- Dial Ticks -->
    <line x1="25" y1="13" x2="25" y2="17" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="25" y1="43" x2="25" y2="47" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="8" y1="30" x2="12" y2="30" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="38" y1="30" x2="42" y2="30" stroke="#94A3B8" stroke-width="1.5" />

    <!-- Timer Hand -->
    <line x1="25" y1="30" x2="35" y2="20" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="25" cy="30" r="3" fill="#1E293B" />

    <!-- Active Speed Sweep Arc -->
    <path d="M25 9 A 21 21 0 0 1 45 30" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>
</svg>
