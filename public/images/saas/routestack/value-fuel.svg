<svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pumpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="dropGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Gas Pump Body -->
  <rect x="25" y="30" width="55" height="95" rx="8" fill="url(#pumpGrad)" stroke="#9A3412" stroke-width="2" />
  <!-- Roof cap -->
  <rect x="20" y="24" width="65" height="8" rx="4" fill="#9A3412" />
  
  <!-- Meter Display Screen -->
  <rect x="33" y="44" width="39" height="26" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
  <text x="52.5" y="56" fill="#92400E" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">$42.80</text>
  <text x="52.5" y="65" fill="#B45309" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle">10.4 GAL</text>

  <!-- Pump Nozzle Holder -->
  <rect x="80" y="55" width="8" height="14" rx="2" fill="#475569" />
  <!-- Flexible Hose -->
  <path d="M85 62 Q105 75 98 105 T80 120" stroke="#334155" stroke-width="4" fill="none" stroke-linecap="round" />
  <!-- Nozzle Handle -->
  <path d="M80 50 L92 42 L94 48 L86 54 Z" fill="#1E293B" />
  <path d="M92 42 L100 36" stroke="#475569" stroke-width="3" stroke-linecap="round" />

  <!-- Base Plate -->
  <rect x="18" y="125" width="69" height="8" rx="3" fill="#64748B" />

  <!-- Downward Green Efficiency Arrows -->
  <g transform="translate(108, 30)">
    <!-- Arrow 1 (Large) -->
    <path d="M18 10 L18 65 M18 65 L6 50 M18 65 L30 50" stroke="url(#dropGreen)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrow 2 (Small) -->
    <path d="M38 25 L38 60 M38 60 L28 48 M38 60 L48 48" stroke="url(#dropGreen)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- -25% Pill Badge -->
    <rect x="-2" y="75" width="46" height="20" rx="10" fill="#DCFCE7" stroke="#10B981" stroke-width="1.5" />
    <text x="21" y="89" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">-25%</text>
  </g>
</svg>
