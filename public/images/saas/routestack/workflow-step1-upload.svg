<svg viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="greenArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card Tone -->
  <rect width="320" height="220" rx="16" fill="#0B1528" stroke="#1E293B" stroke-width="1.5" />

  <!-- Inbound Ingestion Arrow -->
  <g transform="translate(30, 90)">
    <path d="M0 20 L35 20 M35 20 L22 8 M35 20 L22 32" stroke="url(#greenArrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGreen)" />
  </g>

  <!-- Orders Document Spreadsheet Sheet -->
  <g transform="translate(85, 30)">
    <!-- Document Base Sheet -->
    <rect x="0" y="0" width="110" height="155" rx="8" fill="url(#docGrad)" stroke="#CBD5E1" stroke-width="2" />
    <!-- Folded Corner -->
    <path d="M85 0 L110 25 L85 25 Z" fill="#94A3B8" />
    <path d="M85 0 L110 25 L110 0 Z" fill="#0B1528" />

    <!-- Document Header -->
    <rect x="15" y="15" width="55" height="10" rx="3" fill="#0284C7" />
    <line x1="15" y1="35" x2="95" y2="35" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Order Rows with Green Verification Checkmarks -->
    <!-- Row 1 -->
    <g transform="translate(15, 48)">
      <circle cx="6" cy="6" r="6" fill="#DCFCE7" />
      <path d="M3 6 L5 8 L9 4" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round" />
      <rect x="18" y="2" width="65" height="8" rx="2" fill="#E2E8F0" />
    </g>
    <!-- Row 2 -->
    <g transform="translate(15, 70)">
      <circle cx="6" cy="6" r="6" fill="#DCFCE7" />
      <path d="M3 6 L5 8 L9 4" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round" />
      <rect x="18" y="2" width="50" height="8" rx="2" fill="#E2E8F0" />
    </g>
    <!-- Row 3 -->
    <g transform="translate(15, 92)">
      <circle cx="6" cy="6" r="6" fill="#DCFCE7" />
      <path d="M3 6 L5 8 L9 4" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round" />
      <rect x="18" y="2" width="58" height="8" rx="2" fill="#E2E8F0" />
    </g>
    <!-- Row 4 -->
    <g transform="translate(15, 114)">
      <circle cx="6" cy="6" r="6" fill="#DCFCE7" />
      <path d="M3 6 L5 8 L9 4" stroke="#16A34A" stroke-width="1.5" stroke-linecap="round" />
      <rect x="18" y="2" width="45" height="8" rx="2" fill="#E2E8F0" />
    </g>
  </g>

  <!-- Large Outbound Transition Arrow to Step 2 -->
  <g transform="translate(225, 95)">
    <path d="M0 15 L50 15 M50 15 L35 0 M50 15 L35 30" stroke="#EA580C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
