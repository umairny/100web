<svg viewBox="0 0 380 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="mapFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2440" />
      <stop offset="100%" stop-color="#081525" />
    </linearGradient>
    <filter id="neonRoute" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="380" height="240" rx="16" fill="#0B1528" stroke="#1E293B" stroke-width="1.5" />

  <!-- Cloud AI Optimization Node (Top Right) -->
  <g transform="translate(230, 25)">
    <!-- Cloud base -->
    <path d="M25 45 C10 45 0 35 0 20 C0 8 10 0 22 0 C28 -12 45 -15 60 -5 C70 -12 85 -5 88 5 C100 5 110 15 110 28 C110 40 100 45 85 45 Z" fill="url(#cloudGrad)" />
    <!-- Rotating Algorithmic Gear -->
    <g transform="translate(55, 20)">
      <circle cx="0" cy="0" r="10" fill="#FFFFFF" opacity="0.9" />
      <circle cx="0" cy="0" r="5" fill="#0284C7" />
      <!-- Teeth -->
      <rect x="-2" y="-14" width="4" height="28" fill="#FFFFFF" opacity="0.9" rx="1" />
      <rect x="-2" y="-14" width="4" height="28" fill="#FFFFFF" opacity="0.9" rx="1" transform="rotate(45)" />
      <rect x="-2" y="-14" width="4" height="28" fill="#FFFFFF" opacity="0.9" rx="1" transform="rotate(90)" />
      <rect x="-2" y="-14" width="4" height="28" fill="#FFFFFF" opacity="0.9" rx="1" transform="rotate(135)" />
    </g>
  </g>

  <!-- 3D Folded Topo Route Map (Center and Left) -->
  <g transform="translate(40, 80)">
    <!-- Map Base Quad -->
    <path d="M0 30 L90 0 L180 30 L270 0 L270 95 L180 125 L90 95 L0 125 Z" fill="url(#mapFold)" stroke="#1E3A5F" stroke-width="2" />
    <!-- Fold Shading -->
    <path d="M90 0 L180 30 L180 125 L90 95 Z" fill="#000000" opacity="0.2" />
    <path d="M180 30 L270 0 L270 95 L180 125 Z" fill="#FFFFFF" opacity="0.05" />

    <!-- Grid lines on map -->
    <line x1="30" y1="20" x2="30" y2="115" stroke="#1E3A5F" stroke-dasharray="4 4" />
    <line x1="135" y1="15" x2="135" y2="110" stroke="#1E3A5F" stroke-dasharray="4 4" />
    <line x1="225" y1="15" x2="225" y2="110" stroke="#1E3A5F" stroke-dasharray="4 4" />

    <!-- Curved Multi-Stop Route Path (Neon Cyan / Gold) -->
    <path d="M20 90 Q60 40 100 65 T180 40 T240 70" stroke="#F59E0B" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#neonRoute)" />
    <path d="M20 90 Q60 40 100 65 T180 40 T240 70" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Waypoint 1 -->
    <circle cx="20" cy="90" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
    <!-- Waypoint 2 -->
    <circle cx="100" cy="65" r="7" fill="#0284C7" stroke="#FFFFFF" stroke-width="2" />
    <!-- Waypoint 3 -->
    <circle cx="180" cy="40" r="7" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
    <!-- Waypoint 4 (Finish) -->
    <circle cx="240" cy="70" r="8" fill="#EA580C" stroke="#FFFFFF" stroke-width="2" />

    <!-- Mini Orange Van driving along route -->
    <g transform="translate(130, 30)">
      <rect x="0" y="0" width="26" height="15" rx="3" fill="#EA580C" />
      <path d="M26 4 L33 9 L33 15 L26 15 Z" fill="#EA580C" />
      <path d="M26 6 L31 9 L26 9 Z" fill="#FEF08A" />
      <circle cx="8" cy="15" r="4" fill="#0F172A" />
      <circle cx="25" cy="15" r="4" fill="#0F172A" />
    </g>
  </g>
</svg>
