<svg viewBox="0 0 380 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2440" />
      <stop offset="100%" stop-color="#081525" />
    </linearGradient>
  </defs>

  <rect width="380" height="240" rx="16" fill="#0B1528" stroke="#1E293B" stroke-width="1.5" />

  <!-- Digital ePOD Clipboard (Left) -->
  <g transform="translate(30, 25)">
    <!-- Clipboard Wooden/Dark Backboard -->
    <rect x="0" y="8" width="130" height="175" rx="10" fill="url(#clipGrad)" stroke="#475569" stroke-width="2" />
    <!-- Top Metal Clip -->
    <rect x="35" y="0" width="60" height="18" rx="4" fill="#94A3B8" />
    <circle cx="65" cy="8" r="4" fill="#1E293B" />

    <!-- Digital Paper Sheet -->
    <rect x="10" y="22" width="110" height="150" rx="6" fill="#FFFFFF" />

    <!-- ePOD Header -->
    <rect x="20" y="32" width="45" height="8" rx="2" fill="#0284C7" />
    <text x="22" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="6" font-weight="bold">ePOD PROOF</text>
    
    <!-- Delivery Details -->
    <line x1="20" y1="46" x2="105" y2="46" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="20" y="56" fill="#64748B" font-size="7" font-family="sans-serif">Order: #RS-99214</text>
    <text x="20" y="66" fill="#64748B" font-size="7" font-family="sans-serif">Recipient: J. Miller</text>
    <text x="20" y="76" fill="#16A34A" font-size="7" font-family="sans-serif" font-weight="bold">Delivered: 14:32 PM ✓</text>

    <!-- Digital Signature Box -->
    <rect x="20" y="86" width="90" height="42" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 2" />
    <text x="25" y="96" fill="#94A3B8" font-size="6" font-family="sans-serif">Customer Signature:</text>
    <!-- Cursive Signature Path -->
    <path d="M28 116 Q40 102 46 112 T60 105 T75 118 T95 106" stroke="#0F172A" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Stylus Pen -->
    <g transform="translate(85, 95) rotate(40)">
      <rect x="0" y="0" width="6" height="38" rx="2" fill="#0284C7" />
      <polygon points="0,38 6,38 3,45" fill="#1E293B" />
    </g>

    <!-- Success Stamp Badge -->
    <rect x="20" y="136" width="90" height="22" rx="4" fill="#DCFCE7" />
    <circle cx="32" cy="147" r="6" fill="#10B981" />
    <path d="M29 147 L31 149 L35 145" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <text x="44" y="151" fill="#166534" font-family="system-ui, sans-serif" font-size="8" font-weight="bold">VERIFIED DELIVERY</text>
  </g>

  <!-- Fleet Performance Analytics Dashboard Chart (Right) -->
  <g transform="translate(185, 25)">
    <!-- Chart Window Frame -->
    <rect x="0" y="8" width="165" height="175" rx="10" fill="url(#chartGrad)" stroke="#1E3A5F" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <text x="15" y="32" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Fleet Analytics</text>
    <circle cx="145" cy="28" r="4" fill="#10B981" />

    <!-- KPI Metric Summary -->
    <g transform="translate(15, 45)">
      <text x="0" y="12" fill="#94A3B8" font-size="8" font-family="sans-serif">ON-TIME RATE</text>
      <text x="0" y="28" fill="#10B981" font-size="16" font-weight="bold" font-family="sans-serif">98.6%</text>
      
      <text x="75" y="12" fill="#94A3B8" font-size="8" font-family="sans-serif">TOTAL DROPS</text>
      <text x="75" y="28" fill="#38BDF8" font-size="16" font-weight="bold" font-family="sans-serif">1,248</text>
    </g>

    <!-- Performance Bar Chart -->
    <g transform="translate(18, 160)">
      <!-- Grid line -->
      <line x1="0" y1="0" x2="132" y2="0" stroke="#334155" stroke-width="1" />
      
      <!-- Day 1 (Mon) -->
      <rect x="5" y="-35" width="16" height="35" rx="3" fill="#0284C7" />
      <text x="13" y="12" fill="#64748B" font-size="8" text-anchor="middle">M</text>

      <!-- Day 2 (Tue) -->
      <rect x="30" y="-55" width="16" height="55" rx="3" fill="#0284C7" />
      <text x="38" y="12" fill="#64748B" font-size="8" text-anchor="middle">T</text>

      <!-- Day 3 (Wed) -->
      <rect x="55" y="-45" width="16" height="45" rx="3" fill="#0284C7" />
      <text x="63" y="12" fill="#64748B" font-size="8" text-anchor="middle">W</text>

      <!-- Day 4 (Thu) -->
      <rect x="80" y="-70" width="16" height="70" rx="3" fill="#38BDF8" />
      <text x="88" y="12" fill="#64748B" font-size="8" text-anchor="middle">T</text>

      <!-- Day 5 (Fri) Peak -->
      <rect x="105" y="-80" width="16" height="80" rx="3" fill="#10B981" />
      <text x="113" y="12" fill="#10B981" font-size="8" font-weight="bold" text-anchor="middle">F</text>

      <!-- Sparkline curve -->
      <path d="M13 -35 Q38 -65 63 -45 T113 -80" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>
