<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="radarDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#021E3B" />
      <stop offset="100%" stop-color="#071526" />
    </radialGradient>
    <radialGradient id="beamGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0" />
    </radialGradient>
    <filter id="blipGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Radar Screen Shell -->
  <rect x="25" y="10" width="190" height="160" rx="20" fill="url(#radarDark)" stroke="#0284C7" stroke-width="2.5" />

  <!-- Target Scope Circles -->
  <g transform="translate(120, 90)">
    <circle cx="0" cy="0" r="62" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="0" cy="0" r="44" stroke="#0284C7" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="26" stroke="#0284C7" stroke-opacity="0.7" stroke-width="1.5" />
    <circle cx="0" cy="0" r="8" stroke="#10B981" stroke-width="2" fill="#047857" />

    <!-- Crosshair Lines -->
    <line x1="-66" y1="0" x2="66" y2="0" stroke="#0284C7" stroke-opacity="0.5" stroke-width="1.5" />
    <line x1="0" y1="-66" x2="0" y2="66" stroke="#0284C7" stroke-opacity="0.5" stroke-width="1.5" />

    <!-- Degree markers -->
    <line x1="-48" y1="-48" x2="48" y2="48" stroke="#0284C7" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="48" y1="-48" x2="-48" y2="48" stroke="#0284C7" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Sweeping Beam -->
    <path d="M 0 0 L 38 -46 A 60 60 0 0 1 58 -16 Z" fill="url(#beamGrad)" />
    <line x1="0" y1="0" x2="38" y2="-46" stroke="#34D399" stroke-width="2.5" />

    <!-- Target Blips -->
    <circle cx="28" cy="-28" r="4.5" fill="#34D399" filter="url(#blipGlow)" />
    <circle cx="-32" cy="24" r="3.5" fill="#38BDF8" filter="url(#blipGlow)" />
    <circle cx="34" cy="30" r="3" fill="#34D399" />
    <circle cx="-20" cy="-38" r="3" fill="#F59E0B" />
  </g>

  <!-- Top status corner led -->
  <circle cx="45" cy="28" r="4" fill="#10B981" />
  <rect x="56" y="25" width="48" height="6" rx="3" fill="#0284C7" opacity="0.6" />
</svg>
