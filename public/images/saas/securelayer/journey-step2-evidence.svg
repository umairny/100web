<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <defs>
    <filter id="docShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.2" />
    </filter>
    <linearGradient id="docGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
  </defs>

  <!-- Background Document (Behind) -->
  <g transform="translate(130, 20)" filter="url(#docShadow)">
    <rect x="-35" y="0" width="85" height="110" rx="8" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="2" />
    <!-- Folded Corner -->
    <path d="M 32 0 L 50 18 L 32 18 Z" fill="#BAE6FD" stroke="#7DD3FC" stroke-width="1.5" />
    <!-- Placeholder lines -->
    <rect x="-22" y="24" width="45" height="5" rx="2" fill="#7DD3FC" />
    <rect x="-22" y="36" width="60" height="4" rx="2" fill="#BAE6FD" />
    <rect x="-22" y="46" width="52" height="4" rx="2" fill="#BAE6FD" />
    <rect x="-22" y="56" width="58" height="4" rx="2" fill="#BAE6FD" />
  </g>

  <!-- Foreground Primary Document -->
  <g transform="translate(85, 45)" filter="url(#docShadow)">
    <rect x="-45" y="0" width="98" height="118" rx="10" fill="url(#docGrad1)" stroke="#0284C7" stroke-width="2.5" />
    <!-- Top colored banner -->
    <rect x="-35" y="14" width="52" height="7" rx="3" fill="#0284C7" />
    <!-- Document content lines -->
    <rect x="-35" y="30" width="76" height="5" rx="2" fill="#CBD5E1" />
    <rect x="-35" y="42" width="68" height="5" rx="2" fill="#E2E8F0" />
    <rect x="-35" y="54" width="72" height="5" rx="2" fill="#E2E8F0" />
    <rect x="-35" y="66" width="48" height="5" rx="2" fill="#E2E8F0" />

    <!-- Big Checkmark Badge attached to document -->
    <circle cx="34" cy="94" r="16" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
    <path d="M 27 94 L 32 99 L 41 90" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Smaller Third Floating Evidence Card (Left) -->
  <g transform="translate(48, 95)" filter="url(#docShadow)">
    <rect x="-24" y="0" width="48" height="58" rx="6" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2" />
    <circle cx="0" cy="22" r="10" fill="#E0F2FE" />
    <path d="M -5 22 L -1 25 L 6 18" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="-16" y="38" width="32" height="4" rx="2" fill="#94A3B8" />
    <rect x="-12" y="46" width="24" height="3" rx="1.5" fill="#CBD5E1" />
  </g>

  <!-- Cloud Sync Arrow -->
  <g transform="translate(195, 125)">
    <circle cx="0" cy="0" r="14" fill="#0284C7" stroke="#FFFFFF" stroke-width="2" />
    <path d="M -5 3 L 0 -4 L 5 3 M 0 -4 L 0 5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
