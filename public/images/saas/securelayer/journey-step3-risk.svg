<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <defs>
    <filter id="matrixShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#047857" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Risk Dashboard Window Shell -->
  <g transform="translate(120, 90)" filter="url(#matrixShadow)">
    <rect x="-95" y="-70" width="190" height="140" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="2.5" />

    <!-- Top Window Bar -->
    <rect x="-95" y="-70" width="190" height="24" rx="12" fill="#047857" />
    <circle cx="-80" cy="-58" r="3" fill="#EF4444" />
    <circle cx="-70" cy="-58" r="3" fill="#F59E0B" />
    <circle cx="-60" cy="-58" r="3" fill="#10B981" />
    <rect x="-25" y="-62" width="50" height="8" rx="4" fill="#065F46" />

    <!-- Left Side: Risk Heatmap Matrix (4x3 cells) -->
    <g transform="translate(-80, -32)">
      <!-- Row 1 (High Severity) -->
      <rect x="0" y="0" width="18" height="15" rx="3" fill="#10B981" opacity="0.9" />
      <rect x="22" y="0" width="18" height="15" rx="3" fill="#10B981" />
      <rect x="44" y="0" width="18" height="15" rx="3" fill="#F59E0B" />
      <rect x="66" y="0" width="18" height="15" rx="3" fill="#EF4444" />

      <!-- Row 2 (Medium Severity) -->
      <rect x="0" y="19" width="18" height="15" rx="3" fill="#34D399" />
      <rect x="22" y="19" width="18" height="15" rx="3" fill="#10B981" />
      <rect x="44" y="19" width="18" height="15" rx="3" fill="#10B981" />
      <rect x="66" y="19" width="18" height="15" rx="3" fill="#F59E0B" />

      <!-- Row 3 (Low Severity) -->
      <rect x="0" y="38" width="18" height="15" rx="3" fill="#6EE7B7" />
      <rect x="22" y="38" width="18" height="15" rx="3" fill="#34D399" />
      <rect x="44" y="38" width="18" height="15" rx="3" fill="#10B981" />
      <rect x="66" y="38" width="18" height="15" rx="3" fill="#10B981" />
    </g>

    <!-- Right Side: Interconnected Control Network Graph -->
    <g transform="translate(42, -5)">
      <!-- Connecting lines -->
      <line x1="-15" y1="-18" x2="15" y2="-12" stroke="#34D399" stroke-width="1.8" />
      <line x1="-15" y1="-18" x2="-2" y2="18" stroke="#34D399" stroke-width="1.8" />
      <line x1="15" y1="-12" x2="28" y2="12" stroke="#34D399" stroke-width="1.8" />
      <line x1="-2" y1="18" x2="28" y2="12" stroke="#34D399" stroke-width="1.8" />

      <!-- Nodes -->
      <circle cx="-15" cy="-18" r="8" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="15" cy="-12" r="7" fill="#34D399" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="-2" cy="18" r="9" fill="#059669" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="28" cy="12" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
    </g>

    <!-- Bottom Status Score Bar -->
    <g transform="translate(-80, 42)">
      <rect x="0" y="0" width="160" height="12" rx="6" fill="#065F46" />
      <rect x="0" y="0" width="138" height="12" rx="6" fill="#10B981" />
      <text x="70" y="9.5" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">98.4% Compliant</text>
    </g>
  </g>
</svg>
