<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <defs>
    <filter id="purpleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5B21B6" flood-opacity="0.25" />
    </filter>
    <linearGradient id="purpleDocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
  </defs>

  <!-- Top Certified Document (Center top) -->
  <g transform="translate(120, 15)" filter="url(#purpleShadow)">
    <rect x="-42" y="0" width="84" height="92" rx="8" fill="url(#purpleDocGrad)" stroke="#8B5CF6" stroke-width="2" />
    <!-- Header stripe -->
    <rect x="-30" y="12" width="40" height="5" rx="2.5" fill="#8B5CF6" />
    <!-- Content lines -->
    <rect x="-30" y="24" width="60" height="3" rx="1.5" fill="#C4B5FD" />
    <rect x="-30" y="32" width="52" height="3" rx="1.5" fill="#DDD6FE" />
    <rect x="-30" y="40" width="56" height="3" rx="1.5" fill="#DDD6FE" />

    <!-- Stamp / Gold Ribbon Seal -->
    <circle cx="20" cy="62" r="13" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2" />
    <!-- Ribbon tails -->
    <path d="M 16 73 L 13 86 L 20 81 L 27 86 L 24 73 Z" fill="#6D28D9" />
    <path d="M 15 62 L 18 65 L 25 58" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Handshake Illustration (Bottom foreground) -->
  <g transform="translate(120, 128)" filter="url(#purpleShadow)">
    <!-- Left Hand / Cuff (Blue shirt) -->
    <path d="M -70 12 L -45 12 L -25 -2 L -10 2 L -16 18 L -35 24 L -70 24 Z" fill="#2563EB" />
    <rect x="-72" y="10" width="10" height="16" rx="2" fill="#1E40AF" />

    <!-- Right Hand / Cuff (Purple shirt) -->
    <path d="M 70 12 L 45 12 L 25 -2 L 10 2 L 16 18 L 35 24 L 70 24 Z" fill="#7C3AED" />
    <rect x="62" y="10" width="10" height="16" rx="2" fill="#5B21B6" />

    <!-- Clasped Hands Center -->
    <path d="M -25 -2 L -10 -10 L 10 -10 L 25 -2 L 14 16 L -14 16 Z" fill="#FBBF24" stroke="#D97706" stroke-width="1.5" />
    <!-- Fingers interlaced -->
    <path d="M -12 2 L -2 12 L 8 4 M -8 8 L 2 16" stroke="#B45309" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Celebration sparkles -->
  <g transform="translate(50, 45)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#F59E0B" />
  </g>
  <g transform="translate(195, 45)">
    <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#10B981" />
  </g>
</svg>
