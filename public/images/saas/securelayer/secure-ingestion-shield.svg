<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <radialGradient id="ingestionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    <filter id="ingestFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="210" cy="150" r="130" fill="url(#ingestionGlow)" />

  <!-- Incoming Data Streams from Left -->
  <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round">
    <path d="M 30 90 L 110 90 L 135 115 L 170 115" stroke-dasharray="6 4" opacity="0.8" />
    <circle cx="30" cy="90" r="3.5" fill="#38BDF8" />
    <circle cx="110" cy="90" r="3" fill="#10B981" />

    <path d="M 50 130 L 125 130 L 155 145 L 170 145" opacity="0.9" />
    <circle cx="50" cy="130" r="3.5" fill="#10B981" />

    <path d="M 40 170 L 105 170 L 140 160 L 170 160" stroke-dasharray="4 4" opacity="0.7" />
    <circle cx="40" cy="170" r="3.5" fill="#38BDF8" />

    <path d="M 60 210 L 120 210 L 150 185 L 170 185" opacity="0.85" />
    <circle cx="60" cy="210" r="3.5" fill="#10B981" />
  </g>

  <!-- Secondary gear on lower right -->
  <g transform="translate(295, 195)">
    <circle cx="0" cy="0" r="32" fill="#0F172A" stroke="#0284C7" stroke-width="3" />
    <!-- Gear Cogs -->
    <path d="M -6 -35 L 6 -35 L 5 -30 L -5 -30 Z
             M 24 -24 L 33 -15 L 29 -12 L 20 -20 Z
             M 32 -4 L 35 6 L 30 6 L 27 -2 Z
             M 24 24 L 15 33 L 12 29 L 20 20 Z
             M -6 35 L 6 35 L 5 30 L -5 30 Z
             M -24 24 L -33 15 L -29 12 L -20 20 Z
             M -32 -4 L -35 6 L -30 6 L -27 -2 Z
             M -24 -24 L -15 -33 L -12 -29 L -20 -20 Z" fill="#0284C7" />
    <circle cx="0" cy="0" r="14" fill="#0284C7" />
    <circle cx="0" cy="0" r="6" fill="#0F172A" />
  </g>

  <!-- Main Central Shield -->
  <g transform="translate(210, 150)">
    <!-- Outer Cyan Glow Halo -->
    <path d="M 0 -68 L 52 -38 C 52 24 32 68 0 86 C -32 68 -52 24 -52 -38 Z"
          fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.6" filter="url(#ingestFilter)" />

    <!-- Main Shield Body -->
    <path d="M 0 -62 L 46 -32 C 46 20 28 60 0 76 C -28 60 -46 20 -46 -32 Z"
          fill="url(#shieldGrad2)" />

    <!-- Inner Dark Shield Layer -->
    <path d="M 0 -52 L 38 -26 C 38 14 22 48 0 62 C -22 48 -38 14 -38 -26 Z"
          fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />

    <!-- Emerald Checkmark inside Shield -->
    <path d="M -15 2 L -4 13 L 18 -9"
          stroke="#10B981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#ingestFilter)" />
    <path d="M -15 2 L -4 13 L 18 -9"
          stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Outgoing Processed Lines to the Right -->
  <g stroke="#10B981" stroke-width="2" stroke-linecap="round">
    <path d="M 270 120 L 320 120 L 350 100 L 380 100" opacity="0.8" />
    <circle cx="380" cy="100" r="3" fill="#10B981" />
    <path d="M 270 150 L 330 150 L 360 160 L 390 160" stroke-dasharray="5 3" opacity="0.9" />
    <circle cx="390" cy="160" r="3" fill="#38BDF8" />
  </g>
</svg>
