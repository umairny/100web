<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Gradients -->
    <linearGradient id="outerShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="innerShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#021A3B" />
    </linearGradient>

    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#047857" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient background glow rings -->
  <circle cx="320" cy="270" r="230" fill="url(#heroGlow)" />
  <circle cx="320" cy="270" r="190" stroke="#0284C7" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="320" cy="270" r="145" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />

  <!-- Data Flow Lines & Circuits connecting Central Shield to 4 Nodes -->
  <!-- Top-Left connection: Cloud Database -->
  <path d="M 320 230 L 260 170 L 175 140" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="4 4" stroke-opacity="0.8" />
  <circle cx="260" cy="170" r="3.5" fill="#38BDF8" />
  <circle cx="210" cy="152" r="3" fill="#10B981" />

  <!-- Top-Right connection: Identity & Users -->
  <path d="M 320 230 L 380 170 L 465 140" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="4 4" stroke-opacity="0.8" />
  <circle cx="380" cy="170" r="3.5" fill="#38BDF8" />
  <circle cx="430" cy="152" r="3" fill="#10B981" />

  <!-- Bottom-Left connection: Radar Scanner -->
  <path d="M 300 310 L 240 370 L 170 395" stroke="#0284C7" stroke-width="2.5" stroke-opacity="0.7" />
  <circle cx="240" cy="370" r="3.5" fill="#10B981" />

  <!-- Bottom-Right connection: Code & CI/CD -->
  <path d="M 340 310 L 400 370 L 470 395" stroke="#0284C7" stroke-width="2.5" stroke-opacity="0.7" />
  <circle cx="400" cy="370" r="3.5" fill="#38BDF8" />

  <!-- Extra Circuit Line details -->
  <path d="M 120 270 L 220 270" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3" />
  <circle cx="120" cy="270" r="3" fill="#38BDF8" opacity="0.6" />
  <path d="M 520 270 L 420 270" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3" />
  <circle cx="520" cy="270" r="3" fill="#38BDF8" opacity="0.6" />

  <!-- ==================== NODE 1: TOP-LEFT (Cloud Server Rack) ==================== -->
  <g transform="translate(145, 130)" filter="url(#softShadow)">
    <!-- Base pill card -->
    <rect x="-65" y="-35" width="130" height="70" rx="16" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="2" />
    <!-- Cloud base -->
    <path d="M -40 -5 C -40 -16 -28 -24 -15 -20 C -10 -27 5 -27 12 -18 C 22 -18 28 -10 26 -2 C 34 0 34 14 24 16 L -32 16 C -42 16 -46 5 -40 -5 Z" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5" />
    <!-- Server Stack lines inside cloud -->
    <rect x="-18" y="-6" width="36" height="5" rx="2" fill="#0284C7" />
    <circle cx="13" cy="-3.5" r="1.5" fill="#34D399" />
    <rect x="-18" y="2" width="36" height="5" rx="2" fill="#0284C7" />
    <circle cx="13" cy="4.5" r="1.5" fill="#34D399" />
    <rect x="-18" y="10" width="36" height="5" rx="2" fill="#0284C7" />
    <circle cx="13" cy="12.5" r="1.5" fill="#34D399" />
  </g>

  <!-- ==================== NODE 2: TOP-RIGHT (Identity / Users) ==================== -->
  <g transform="translate(495, 130)" filter="url(#softShadow)">
    <!-- Base pill card -->
    <rect x="-65" y="-35" width="130" height="70" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2" />
    <!-- User avatar & cloud outline -->
    <path d="M 40 -5 C 40 -16 28 -24 15 -20 C 10 -27 -5 -27 -12 -18 C -22 -18 -28 -10 -26 -2 C -34 0 -34 14 -24 16 L 32 16 C 42 16 46 5 40 -5 Z" fill="#DCFCE7" stroke="#10B981" stroke-width="1.5" />
    <!-- User Head & Shoulders -->
    <circle cx="0" cy="-3" r="7" fill="#059669" />
    <path d="M -12 15 C -12 8 -6 5 0 5 C 6 5 12 8 12 15 Z" fill="#059669" />
    <!-- Small check badge -->
    <circle cx="18" cy="-12" r="7.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M 15 -12 L 17 -10 L 21 -14" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== NODE 3: BOTTOM-LEFT (Radar Scanner) ==================== -->
  <g transform="translate(160, 400)" filter="url(#softShadow)">
    <!-- Outer Scope Circle -->
    <circle cx="0" cy="0" r="46" fill="#061E2D" stroke="#0284C7" stroke-width="2.5" />
    <!-- Scope Grid Rings -->
    <circle cx="0" cy="0" r="32" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1.2" fill="none" />
    <circle cx="0" cy="0" r="18" stroke="#0284C7" stroke-opacity="0.5" stroke-width="1.2" fill="none" />
    <!-- Crosshairs -->
    <line x1="-42" y1="0" x2="42" y2="0" stroke="#0284C7" stroke-opacity="0.35" stroke-width="1.2" />
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#0284C7" stroke-opacity="0.35" stroke-width="1.2" />
    <!-- Radar Sweep Sector -->
    <path d="M 0 0 L 26 -26 A 38 38 0 0 1 38 0 Z" fill="url(#radarSweep)" opacity="0.85" />
    <line x1="0" y1="0" x2="26" y2="-26" stroke="#34D399" stroke-width="1.5" />
    <!-- Target Blips -->
    <circle cx="16" cy="-14" r="3" fill="#34D399" filter="url(#glowFilter)" />
    <circle cx="-12" cy="18" r="2.5" fill="#38BDF8" />
    <circle cx="20" cy="16" r="2" fill="#38BDF8" opacity="0.7" />
  </g>

  <!-- ==================== NODE 4: BOTTOM-RIGHT (Code & Infra </>) ==================== -->
  <g transform="translate(480, 400)" filter="url(#softShadow)">
    <rect x="-48" y="-34" width="96" height="68" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <!-- Code Window Dots -->
    <circle cx="-32" cy="-20" r="3" fill="#EF4444" />
    <circle cx="-22" cy="-20" r="3" fill="#F59E0B" />
    <circle cx="-12" cy="-20" r="3" fill="#10B981" />
    <!-- Code Bracket Symbol -->
    <text x="0" y="16" fill="#38BDF8" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
    <!-- Mini infra status badge -->
    <rect x="-30" y="24" width="60" height="4" rx="2" fill="#10B981" opacity="0.8" />
  </g>

  <!-- ==================== CENTRAL CYBER SHIELD ==================== -->
  <g transform="translate(320, 260)">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="5" r="92" fill="#0284C7" opacity="0.18" filter="url(#glowFilter)" />

    <!-- External Shield Border Layer -->
    <path d="M 0 -76 L 62 -42 C 62 25 38 78 0 98 C -38 78 -62 25 -62 -42 Z"
          fill="none" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.8" />

    <!-- Secondary Outer Shield Layer -->
    <path d="M 0 -70 L 56 -38 C 56 22 34 70 0 88 C -34 70 -56 22 -56 -38 Z"
          fill="url(#outerShieldGrad)" filter="url(#softShadow)" />

    <!-- Inner Shield Cavity -->
    <path d="M 0 -62 L 48 -32 C 48 18 28 60 0 76 C -28 60 -48 18 -48 -32 Z"
          fill="url(#innerShieldGrad)" stroke="#38BDF8" stroke-width="1.5" />

    <!-- Central Glowing Core Gradient -->
    <ellipse cx="0" cy="0" rx="32" ry="38" fill="#0284C7" opacity="0.45" filter="url(#glowFilter)" />

    <!-- Big Emerald Checkmark -->
    <path d="M -18 3 L -6 16 L 22 -14"
          stroke="url(#checkGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#glowFilter)" />
    <!-- Crisp checkmark overlay -->
    <path d="M -18 3 L -6 16 L 22 -14"
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Floating Mini Status Badges around Shield -->
    <g transform="translate(68, -48)">
      <circle cx="0" cy="0" r="11" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
      <path d="M -4 0 L -1 3 L 5 -3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <g transform="translate(-68, 48)">
      <circle cx="0" cy="0" r="10" fill="#0284C7" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Floating Compliance Tag Pill at bottom -->
  <g transform="translate(320, 485)" filter="url(#softShadow)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="-114" cy="0" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-98" y="4" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">
      SOC 2 Type II • Continuous Monitoring Active
    </text>
  </g>
</svg>
